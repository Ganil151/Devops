<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#0f172a" />
  
  <!-- Divider -->
  <line x1="600" y1="50" x2="600" y2="350" stroke="#1e293b" stroke-width="2" />

  <!-- Left Side: Monolith vs Modular -->
  <text x="300" y="60" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">🏗️ DESIGN PHILOSOPHY</text>
  
  <g transform="translate(100, 120)">
    <!-- Monolith -->
    <rect x="0" y="0" width="180" height="180" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <text x="90" y="30" fill="#fca5a5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MONOLITH</text>
    <path d="M 40 60 L 140 60 M 40 80 L 120 80 M 40 100 L 150 100 M 40 120 L 100 120 M 40 140 L 140 140" stroke="#991b1b" stroke-width="4" stroke-linecap="round" />
    <text x="90" y="170" fill="#ef4444" font-family="Arial" font-size="11" text-anchor="middle">Long & Redundant</text>
    
    <!-- Arrow -->
    <path d="M 200 90 L 260 90" stroke="#3b82f6" stroke-width="3" />
    <polygon points="255,85 265,90 255,95" fill="#3b82f6" />
    
    <!-- Modular -->
    <rect x="280" y="0" width="180" height="180" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="370" y="30" fill="#6ee7b7" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MODULAR</text>
    <!-- Blocks -->
    <rect x="300" y="60" width="60" height="30" rx="4" fill="#065f46" stroke="#10b981" />
    <rect x="380" y="60" width="60" height="30" rx="4" fill="#065f46" stroke="#10b981" />
    <rect x="340" y="100" width="60" height="30" rx="4" fill="#065f46" stroke="#10b981" />
    <text x="370" y="170" fill="#10b981" font-family="Arial" font-size="11" text-anchor="middle">Clean & Reusable</text>
  </g>

  <!-- Right Side: Sourcing Flow -->
  <text x="900" y="60" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">📚 FUNCTION SOURCING</text>

  <g transform="translate(750, 150)">
    <!-- lib.sh -->
    <rect x="0" y="0" width="120" height="150" rx="5" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <text x="60" y="25" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">utils.sh</text>
    <rect x="20" y="45" width="80" height="10" rx="2" fill="#1e40af" />
    <rect x="20" y="65" width="80" height="10" rx="2" fill="#1e40af" />
    
    <!-- Source Arrow -->
    <path d="M 130 75 L 200 75" stroke="#3b82f6" stroke-width="3" stroke-dasharray="5,2" />
    <text x="165" y="65" fill="#3b82f6" font-family="Arial" font-size="12" text-anchor="middle">source</text>
    
    <!-- main.sh -->
    <rect x="210" y="0" width="120" height="150" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="270" y="25" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">deploy.sh</text>
    <text x="270" y="80" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">call utils_func</text>
  </g>

  <!-- Footer -->
  <text x="1180" y="380" fill="#64748b" font-family="Arial" font-size="16" text-anchor="end" font-weight="bold">MODULAR SCRIPT ARCHITECTURE</text>
</svg>
