<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="500" fill="#0f172a" />
  
  <!-- Defs -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <!-- Start Node -->
  <g transform="translate(600, 50)">
    <rect x="-100" y="-25" width="200" height="50" rx="25" fill="#3b82f6" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
    <text x="0" y="5" fill="#ffffff" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold">User types: command</text>
  </g>

  <!-- Flow Line -->
  <line x1="600" y1="75" x2="600" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Diamond 1: Keyword -->
  <g transform="translate(600, 140)">
    <path d="M 0 -40 L 60 0 L 0 40 L -60 0 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="0" y="5" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle">Keyword?</text>
  </g>

  <!-- Yes -> Run (Keyword) -->
  <line x1="660" y1="140" x2="800" y2="140" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="1010" y="145" fill="#10b981" font-family="Arial" font-size="14" font-weight="bold">Shell Keyword (if, then, else)</text>

  <!-- No -> Next -->
  <line x1="600" y1="180" x2="600" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Alias -->
  <g transform="translate(600, 240)">
    <path d="M 0 -40 L 60 0 L 0 40 L -60 0 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="0" y="5" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle">Alias?</text>
  </g>
  <line x1="660" y1="240" x2="800" y2="240" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="1010" y="245" fill="#10b981" font-family="Arial" font-size="14" font-weight="bold">Alias (ll, gs)</text>

  <line x1="600" y1="280" x2="600" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Built-in/Function -->
  <g transform="translate(600, 340)">
    <path d="M 0 -40 L 60 0 L 0 40 L -60 0 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="0" y="5" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle">Built-in?</text>
  </g>
  <line x1="660" y1="340" x2="800" y2="340" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="1010" y="345" fill="#10b981" font-family="Arial" font-size="14" font-weight="bold">Shell Built-in (cd, echo)</text>

  <line x1="600" y1="380" x2="600" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- PATH Search -->
  <g transform="translate(600, 440)">
    <rect x="-100" y="-25" width="200" height="50" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="0" y="5" fill="#ffffff" font-family="monospace" font-size="14" text-anchor="middle">Search $PATH</text>
  </g>
  
  <line x1="700" y1="440" x2="800" y2="440" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="1010" y="445" fill="#10b981" font-family="Arial" font-size="14" font-weight="bold">External Binary (grep, terraform)</text>

  <!-- Error Path -->
  <line x1="500" y1="440" x2="400" y2="440" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="250" y="445" fill="#ef4444" font-family="Arial" font-size="14" font-weight="bold" text-anchor="start">❌ COMMAND NOT FOUND</text>

  <!-- Title Bottom -->
  <text x="1180" y="480" fill="#64748b" font-family="Arial" font-size="16" text-anchor="end" font-weight="bold">COMMAND RESOLUTION ORDER</text>
</svg>
