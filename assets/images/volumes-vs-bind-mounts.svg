<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" rx="24" fill="#0F172A"/>
  <rect x="0.5" y="0.5" width="799" height="449" rx="23.5" stroke="#334155"/>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="url(#title_grad)" font-family="Inter, sans-serif" font-size="28" font-weight="800">Visualizing Volumes vs Bind Mounts</text>
  <defs>
    <linearGradient id="title_grad" x1="300" y1="50" x2="500" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Left Card (Named Volumes) -->
  <rect x="60" y="100" width="320" height="180" rx="16" fill="#1E293B" fill-opacity="0.7" stroke="#334155"/>
  <rect x="60" y="100" width="320" height="4" rx="2" fill="#38BDF8"/>
  
  <rect x="195" y="125" width="50" height="50" rx="8" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-width="2"/>
  <path d="M205 145V140C205 137.239 207.239 135 210 135H215" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M235 155V160C235 162.761 232.761 165 230 165H225" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

  <text x="220" y="200" text-anchor="middle" fill="#F8FAF8" font-family="Inter, sans-serif" font-size="20" font-weight="600">Named Volumes</text>
  <rect x="110" y="215" width="220" height="28" rx="6" fill="#020617"/>
  <text x="220" y="234" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">/var/lib/docker/volumes/</text>
  <text x="220" y="260" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Managed by Docker Engine</text>

  <!-- Right Card (Bind Mounts) -->
  <rect x="420" y="100" width="320" height="180" rx="16" fill="#1E293B" fill-opacity="0.7" stroke="#334155"/>
  <rect x="420" y="100" width="320" height="4" rx="2" fill="#4ADE80"/>

  <rect x="555" y="125" width="50" height="50" rx="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-width="2"/>
  <path d="M565 135H580L585 140H595V165H565V135Z" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="580" y="200" text-anchor="middle" fill="#F8FAF8" font-family="Inter, sans-serif" font-size="20" font-weight="600">Bind Mounts</text>
  <rect x="470" y="215" width="220" height="28" rx="6" fill="#020617"/>
  <text x="580" y="234" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">/home/user/project/data/</text>
  <text x="580" y="260" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Direct path on Host Machine</text>

  <!-- Container Box -->
  <rect x="300" y="350" width="200" height="50" rx="12" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="415" y="381" text-anchor="middle" fill="#F8FAF8" font-family="Inter, sans-serif" font-size="16" font-weight="600">Docker Container</text>
  <path d="M320 370H335H340V375H320V370Z" fill="#F8FAF8" opacity="0.2"/>
  <rect x="320" y="370" width="20" height="10" rx="2" stroke="#F8FAF8" stroke-width="1.5"/>

  <!-- Connection Lines -->
  <path d="M220 280V320H350V350" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M580 280V320H450V350" stroke="#4ADE80" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
</svg>
