<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#grad1)" rx="15" />
  
  <!-- Grid Lines (Subtle) -->
  <path d="M50 50 H750 M50 100 H750 M50 150 H750" stroke="#334155" stroke-width="1" opacity="0.3" />
  
  <!-- Title Text -->
  <text x="50" y="80" font-family="'Segoe UI', sans-serif" font-size="32" fill="#e2e8f0" font-weight="bold">Arithmetic &amp; Metrics</text>
  <text x="50" y="110" font-family="'Segoe UI', sans-serif" font-size="16" fill="#94a3b8">Bash Integer Math • Floating Point (bc) • System Monitoring</text>
  
  <!-- Floating Symbols -->
  <text x="600" y="60" font-family="monospace" font-size="40" fill="#22d3ee" opacity="0.8" filter="url(#glow)">$(( ))</text>
  <text x="700" y="140" font-family="monospace" font-size="30" fill="#f472b6" opacity="0.8">bc</text>
  <text x="550" y="160" font-family="monospace" font-size="24" fill="#a78bfa" opacity="0.6">%</text>
  
  <!-- Metric Graph Visualization -->
  <path d="M400 150 L440 150 L460 110 L480 140 L500 90 L520 120 L550 150" fill="none" stroke="#34d399" stroke-width="3" filter="url(#glow)" />
  <circle cx="460" cy="110" r="3" fill="#34d399" />
  <circle cx="500" cy="90" r="3" fill="#34d399" />
  <circle cx="520" cy="120" r="3" fill="#34d399" />
  
  <!-- Variable block simulation -->
  <rect x="580" y="85" width="180" height="80" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="590" y="110" font-family="monospace" font-size="12" fill="#cbd5e1">DISK_USAGE=88</text>
  <text x="590" y="125" font-family="monospace" font-size="12" fill="#cbd5e1">LIMIT=85</text>
  <text x="590" y="140" font-family="monospace" font-size="12" fill="#fbbf24">if [ $DISK > $LIMIT ]</text>

</svg>
