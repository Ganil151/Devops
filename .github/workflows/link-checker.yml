name: Link Checker & Content Validation

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

jobs:
  link-checker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Dependencies
      run: |
        npm install -g markdown-link-check
        sudo apt-get update
        sudo apt-get install -y shellcheck
        
    - name: Check Markdown Links
      run: |
        echo "Checking markdown links..."
        find . -name "*.md" -not -path "./.git/*" -not -path "./node_modules/*" | \
        xargs -I {} markdown-link-check {} --config .github/link-check-config.json
        
    - name: Check Local File References
      run: |
        echo "Checking local file references..."
        ./.github/scripts/check-local-files.sh
        
    - name: Validate Shell Scripts
      run: |
        echo "Validating shell scripts with ShellCheck..."
        find . -name "*.sh" -not -path "./.git/*" | xargs shellcheck -e SC1091
        
    - name: Check Image References
      run: |
        echo "Checking image references..."
        ./.github/scripts/check-images.sh
        
    - name: Generate Link Report
      if: failure()
      run: |
        echo "Link check failed. Generating report..."
        echo "## Link Check Results" >> $GITHUB_STEP_SUMMARY
        echo "❌ Some links are broken. Check the logs above for details." >> $GITHUB_STEP_SUMMARY
        
  content-validation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Validate Exercise Structure
      run: |
        echo "Validating exercise structure..."
        ./.github/scripts/validate-exercises.sh
        
    - name: Check Prerequisites Links
      run: |
        echo "Validating prerequisite links..."
        ./.github/scripts/check-prerequisites.sh
        
    - name: Validate Mermaid Diagrams
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - run: |
        npm install -g @mermaid-js/mermaid-cli
        find . -name "*.md" -exec grep -l "```mermaid" {} \; | \
        xargs ./.github/scripts/validate-mermaid.sh