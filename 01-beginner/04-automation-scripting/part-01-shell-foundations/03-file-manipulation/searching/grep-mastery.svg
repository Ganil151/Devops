<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="300" fill="#2c3e50"/>
  
  <!-- Title Banner -->
  <rect x="50" y="20" width="500" height="40" fill="#34495e" stroke="#fff" stroke-width="2" rx="5"/>
  <text x="300" y="45" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">🔍 SEARCHING IN FILES: The Art of Grep</text>
  
  <!-- Log File Source -->
  <rect x="50" y="100" width="120" height="60" fill="#3498db" stroke="#fff" stroke-width="2" rx="8"/>
  <text x="110" y="125" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">📄 Log File</text>
  <text x="110" y="140" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Source</text>
  
  <!-- Arrow 1 -->
  <path d="M 170 130 L 220 130" stroke="#fff" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="195" y="125" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">Stream Data</text>
  
  <!-- Filter (Grep) -->
  <polygon points="240,100 320,130 240,160" fill="#f1c40f" stroke="#333" stroke-width="2"/>
  <text x="280" y="125" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🔍 Filter</text>
  <text x="280" y="140" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="12" font-weight="bold">(Grep)</text>
  
  <!-- Arrow 2 (Match Found) -->
  <path d="M 320 120 L 380 100" stroke="#fff" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="350" y="105" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">Match Found</text>
  
  <!-- Arrow 3 (No Match) -->
  <path d="M 320 140 L 380 160" stroke="#fff" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="350" y="155" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">No Match</text>
  
  <!-- Result Box -->
  <rect x="400" y="80" width="150" height="50" fill="#2ecc71" stroke="#fff" stroke-width="2" rx="8"/>
  <text x="475" y="100" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="12" font-weight="bold">✅ Output:</text>
  <text x="475" y="115" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="11">'Error: 500'</text>
  
  <!-- Trash Box -->
  <rect x="400" y="150" width="150" height="50" fill="#95a5a6" stroke="#fff" stroke-width="2" rx="8"/>
  <text x="475" y="175" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🗑️ Discarded</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff"/>
    </marker>
  </defs>
  
  <!-- Bottom decorative elements -->
  <circle cx="100" cy="250" r="15" fill="#e74c3c" opacity="0.3"/>
  <circle cx="300" cy="260" r="12" fill="#9b59b6" opacity="0.3"/>
  <circle cx="500" cy="250" r="18" fill="#1abc9c" opacity="0.3"/>
</svg>