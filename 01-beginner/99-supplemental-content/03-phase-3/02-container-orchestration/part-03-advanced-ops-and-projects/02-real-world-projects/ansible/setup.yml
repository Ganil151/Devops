---
- name: Deploy Docker Project Stack
  hosts: all
  become: yes
  vars:
    project_dir: "/home/{{ ansible_user }}/docker-project"
    docker_hub_user: "ganil151"

  tasks:
    - name: 1. Install Dependencies
      apt:
        name: [apt-transport-https, ca-certificates, curl, software-properties-common, python3-pip]
        state: present
        update_cache: yes

    - name: 2. Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: 3. Add Docker Repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: 4. Install Docker Engine
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present

    - name: 5. Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: 6. Create Project Directory
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: 7. Copy Project Files
      copy:
        src: ../
        dest: "{{ project_dir }}/"
        exclude: ["ansible", "postgres-data", "Flask-data", "*.pem"]

    - name: 8. Login to Docker Hub (Optional but recommended)
      command: "docker login -u {{ docker_hub_user }} -p {{ docker_hub_password }}"
      no_log: true
      when: docker_hub_password is defined

    - name: 9. Launch Production Stack
      command:
        cmd: "docker compose -f compose.yaml -f compose.prod.yaml up -d"
        chdir: "{{ project_dir }}"
      become_user: "{{ ansible_user }}"

  handlers:
    - name: Restart Docker
      service:
        name: docker
        state: restarted
