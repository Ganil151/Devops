---
- name: Install System Prerequisites
  package:
    name:
      - curl
      - unzip
      - git
    state: present

# ---------------------------------------------------------
# 1. Docker Installation
# ---------------------------------------------------------
- name: Install Docker (Generic)
  package:
    name: docker.io
    state: present
  when: ansible_os_family == "Debian"

- name: Install Docker (Amazon Linux)
  package:
    name: docker
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure Docker Service is Running
  service:
    name: docker
    state: started
    enabled: yes

- name: Add Users to Docker Group
  user:
    name: '{{ item }}'
    groups: docker
    append: yes
  loop: '{{ docker_users }}'
  ignore_errors: yes # Ignore if user doesn't exist on specific OS

# ---------------------------------------------------------
# 2. Terraform & Terragrunt
# ---------------------------------------------------------
- name: Download and Unzip Terraform
  unarchive:
    src: 'https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip'
    dest: '{{ bin_path }}'
    remote_src: yes
    creates: '{{ bin_path }}/terraform'
    mode: '0755'

- name: Download Terragrunt
  get_url:
    url: 'https://github.com/gruntwork-io/terragrunt/releases/download/{{ terragrunt_version }}/terragrunt_linux_amd64'
    dest: '{{ bin_path }}/terragrunt'
    mode: '0755'

# ---------------------------------------------------------
# 3. AWS CLI v2
# ---------------------------------------------------------
- name: Check if AWS CLI is installed
  stat:
    path: '{{ bin_path }}/aws'
  register: aws_cli_bin

- name: Download and Install AWS CLI v2
  block:
    - name: Download AWS CLI Zip
      get_url:
        url: 'https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip'
        dest: '/tmp/awscliv2.zip'

    - name: Unzip AWS CLI
      unarchive:
        src: '/tmp/awscliv2.zip'
        dest: '/tmp'
        remote_src: yes

    - name: Run AWS Install Script
      command: '/tmp/aws/install --update'
  when: not aws_cli_bin.stat.exists

# ---------------------------------------------------------
# 4. Kubernetes Tools (Kubectl & Helm)
# ---------------------------------------------------------
- name: Install Kubectl
  get_url:
    url: 'https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl'
    dest: '{{ bin_path }}/kubectl'
    mode: '0755'

- name: Install Helm
  shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: '{{ bin_path }}/helm'

# ---------------------------------------------------------
# 5. Custom Script Management
# ---------------------------------------------------------
- name: Deploy Custom DevOps Scripts
  copy:
    src: '{{ item }}'
    dest: '{{ bin_path }}/'
    mode: '0755'
    owner: root
    group: root
  with_fileglob:
    - 'files/*.sh'
    - 'files/*.py'
