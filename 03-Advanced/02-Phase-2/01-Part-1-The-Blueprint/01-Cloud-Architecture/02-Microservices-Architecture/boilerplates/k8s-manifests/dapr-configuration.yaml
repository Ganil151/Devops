---
# Dapr Configuration
# 
# Dapr (Distributed Application Runtime) provides building blocks for
# microservices including service invocation, pub/sub, state management, etc.
#
# Architecture:
# ┌────────────────────────────────────────┐
# │           Pod                          │
# │  ┌──────────┐      ┌──────────────┐   │
# │  │   App    │◄────►│    Dapr      │   │
# │  │Container │      │   Sidecar    │   │
# │  └──────────┘      └──────────────┘   │
# │       :8080        :3500 (HTTP API)   │
# │                    :50001 (gRPC API)  │
# └────────────────────────────────────────┘
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  namespace: default
spec:
  # Distributed tracing configuration
  tracing:
    samplingRate: "1"  # Sample 100% of requests (reduce in production)
    zipkin:
      endpointAddress: "http://zipkin.istio-system:9411/api/v2/spans"
  
  # mTLS configuration
  mtls:
    enabled: true
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"
  
  # Access control
  accessControl:
    defaultAction: deny
    trustDomain: "public"
    policies:
    - appId: order-service
      defaultAction: allow
      trustDomain: "public"
      namespace: "default"
  
  # Metrics
  metric:
    enabled: true
  
  # API configuration
  api:
    allowed:
    - name: state
      version: v1
      protocol: http
    - name: pubsub
      version: v1
      protocol: http

---
# Redis State Store Component
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: default
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis-master:6379
  - name: redisPassword
    secretKeyRef:
      name: redis-secret
      key: password
  - name: enableTLS
    value: "false"
  - name: actorStateStore
    value: "true"

---
# Kafka Pub/Sub Component
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: order-events
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: kafka-broker-0:9092,kafka-broker-1:9092,kafka-broker-2:9092
  - name: authType
    value: none
  - name: consumerGroup
    value: order-service-group
  - name: clientID
    value: order-service

---
# Service Deployment with Dapr Sidecar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        # Dapr annotations
        dapr.io/enabled: "true"
        dapr.io/app-id: "order-service"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        dapr.io/config: "dapr-config"
        dapr.io/log-level: "info"
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "9090"
        dapr.io/sidecar-cpu-limit: "500m"
        dapr.io/sidecar-memory-limit: "512Mi"
        dapr.io/sidecar-cpu-request: "100m"
        dapr.io/sidecar-memory-request: "128Mi"
    spec:
      containers:
      - name: order-service
        image: order-service:1.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: DAPR_HTTP_PORT
          value: "3500"
        - name: DAPR_GRPC_PORT
          value: "50001"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  - name: dapr-http
    protocol: TCP
    port: 3500
    targetPort: 3500
  - name: dapr-grpc
    port: 50001
    targetPort: 50001
  type: ClusterIP

---
# Example: Subscription to Kafka Topic
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: order-placed-subscription
  namespace: default
spec:
  topic: order-placed
  routes:
    default: /events/order-placed
  pubsubname: order-events
  metadata:
    rawPayload: "false"
  scopes:
  - order-service
  - inventory-service
  - payment-service

---
# Secret for Redis password
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: default
type: Opaque
data:
  password: cGFzc3dvcmQxMjM=  # base64 encoded "password123"

---
# Example Client Deployment (calls order-service via Dapr)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "frontend-service"
        dapr.io/app-port: "3000"
    spec:
      containers:
      - name: frontend
        image: frontend-service:1.0
        env:
        # Call order-service via Dapr service invocation
        # Example: curl http://localhost:3500/v1.0/invoke/order-service/method/api/orders
        - name: DAPR_HTTP_PORT
          value: "3500"
        - name: ORDER_SERVICE_URL
          value: "http://localhost:3500/v1.0/invoke/order-service/method"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
