<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="500" fill="#0f172a" />
  
  <!-- Divider -->
  <line x1="600" y1="50" x2="600" y2="450" stroke="#1e293b" stroke-width="2" />

  <!-- Left Side: Loop Mechanics -->
  <text x="300" y="80" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">⚙️ ITERATION CONTROL</text>
  
  <g transform="translate(300, 150)">
    <!-- Start -->
    <rect x="-60" y="-30" width="120" height="40" rx="20" fill="#3b82f6" />
    <text x="0" y="-5" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">Enter Loop</text>
    
    <!-- Arrow Down -->
    <line x1="0" y1="10" x2="0" y2="50" stroke="#64748b" stroke-width="2" />
    
    <!-- Condition -->
    <g transform="translate(0, 100)">
      <path d="M 0 -50 L 80 0 L 0 50 L -80 0 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />
      <text x="0" y="5" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">Has Items?</text>
    </g>
    
    <!-- Loop Body Logic -->
    <rect x="-60" y="200" width="120" height="60" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="0" y="235" fill="#10b981" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Process Item</text>
    
    <!-- Arrows -->
    <line x1="0" y1="150" x2="0" y2="200" stroke="#10b981" stroke-width="2" />
    <path d="M -60 230 L -120 230 L -120 100 L -80 100" fill="none" stroke="#64748b" stroke-width="2" />
    
    <!-- Exit -->
    <line x1="80" y1="100" x2="180" y2="100" stroke="#ef4444" stroke-width="2" />
    <text x="210" y="105" fill="#ef4444" font-family="Arial" font-size="14" text-anchor="start">Exit (No)</text>
  </g>

  <!-- Right Side: Interrupts -->
  <text x="900" y="80" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">⚡ LOOP INTERRUPTORS</text>

  <g transform="translate(750, 150)">
    <!-- Break -->
    <rect x="0" y="0" width="300" height="80" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <text x="20" y="35" fill="#ef4444" font-family="Arial" font-size="18" font-weight="bold">BREAK</text>
    <text x="20" y="60" fill="#fca5a5" font-family="Arial" font-size="14">Immediate Exit of the entire loop.</text>
    
    <!-- Continue -->
    <rect x="0" y="120" width="300" height="80" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="20" y="155" fill="#3b82f6" font-family="Arial" font-size="18" font-weight="bold">CONTINUE</text>
    <text x="20" y="180" fill="#94a3b8" font-family="Arial" font-size="14">Skip this item, go to next iteration.</text>
  </g>

  <!-- Footer -->
  <text x="1180" y="480" fill="#64748b" font-family="Arial" font-size="16" text-anchor="end" font-weight="bold">ITERATION CONTROL ARCHITECTURE</text>
</svg>
