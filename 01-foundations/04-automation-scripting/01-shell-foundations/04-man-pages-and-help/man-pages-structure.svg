<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#0f172a" />
  
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Title / Main Command -->
  <g transform="translate(600, 80)">
    <rect x="-100" y="-30" width="200" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#glow)" />
    <text x="0" y="5" fill="#ffffff" font-family="monospace" font-size="24" text-anchor="middle" font-weight="bold">man command</text>
  </g>

  <!-- Branches -->
  <!-- Line to Section 1 -->
  <path d="M 500 110 L 300 180" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" />
  <!-- Line to Section 5 -->
  <path d="M 600 110 L 600 180" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" />
  <!-- Line to Section 8 -->
  <path d="M 700 110 L 900 180" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" />

  <!-- Section 1 -->
  <g transform="translate(300, 220)">
    <rect x="-100" y="-40" width="200" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="0" y="-10" fill="#10b981" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Section 1</text>
    <text x="0" y="15" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">User Commands</text>
    <text x="0" y="35" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">ls, grep, cat</text>
  </g>

  <!-- Section 5 -->
  <g transform="translate(600, 220)">
    <rect x="-100" y="-40" width="200" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="0" y="-10" fill="#f59e0b" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Section 5</text>
    <text x="0" y="15" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">File Formats</text>
    <text x="0" y="35" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">/etc/passwd, .ssh/config</text>
  </g>

  <!-- Section 8 -->
  <g transform="translate(900, 220)">
    <rect x="-100" y="-40" width="200" height="80" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <text x="0" y="-10" fill="#ef4444" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Section 8</text>
    <text x="0" y="15" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">System Admin Cmds</text>
    <text x="0" y="35" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">iptables, useradd</text>
  </g>

  <!-- Footer -->
  <text x="1180" y="380" fill="#64748b" font-family="Arial" font-size="14" text-anchor="end">UNIX MANUAL STRUCTURE</text>
</svg>
