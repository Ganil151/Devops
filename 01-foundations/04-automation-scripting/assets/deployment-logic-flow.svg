<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Mode Deployment Logic Flow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#121212" />

  <!-- Start Node -->
  <rect x="350" y="20" width="100" height="40" rx="20" fill="#4CAF50" filter="url(#shadow)" />
  <text x="400" y="45" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">Start</text>
  
  <!-- Arrow Down -->
  <line x1="400" y1="60" x2="400" y2="90" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Decision: Env Valid? -->
  <polygon points="400,90 480,130 400,170 320,130" fill="#1E1E1E" stroke="#BB86FC" stroke-width="2" filter="url(#shadow)" />
  <text x="400" y="135" text-anchor="middle" font-family="Arial" font-size="12" fill="#E0E0E0">Env Valid?</text>
  
  <!-- "No" path -->
  <line x1="320" y1="130" x2="250" y2="130" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="285" y="125" text-anchor="middle" font-family="Arial" font-size="11" fill="#EF5350">No</text>
  <rect x="150" y="110" width="100" height="40" rx="5" fill="#C62828" />
  <text x="200" y="135" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Error Exit</text>

  <!-- "Yes" path -->
  <line x1="400" y1="170" x2="400" y2="200" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="415" y="185" text-anchor="middle" font-family="Arial" font-size="11" fill="#4CAF50">Yes</text>

  <!-- Step: Pre-checks -->
  <rect x="320" y="200" width="160" height="50" rx="5" fill="#1E1E1E" stroke="#2196F3" stroke-width="2" filter="url(#shadow)" />
  <text x="400" y="230" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#E0E0E0">Pre-deployment Checks</text>

  <!-- Arrow -->
  <line x1="400" y1="250" x2="400" y2="280" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Loop: For each server -->
  <rect x="300" y="280" width="200" height="60" rx="10" fill="#2E7D32" filter="url(#shadow)" />
  <text x="400" y="310" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">FOR EACH SERVER</text>
  <text x="400" y="330" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff" opacity="0.8">(web01, web02, web03...)</text>

  <!-- Arrow -->
  <line x1="400" y1="340" x2="400" y2="370" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Step: Deploy -->
  <rect x="320" y="370" width="160" height="50" rx="5" fill="#1E1E1E" stroke="#1565C0" stroke-width="2" filter="url(#shadow)" />
  <text x="400" y="400" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#E0E0E0">Deploy to Server</text>

  <!-- Arrow -->
  <line x1="400" y1="420" x2="400" y2="450" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Decision: Health OK? -->
  <polygon points="400,450 480,490 400,530 320,490" fill="#1E1E1E" stroke="#FF9800" stroke-width="2" filter="url(#shadow)" />
  <text x="400" y="495" text-anchor="middle" font-family="Arial" font-size="12" fill="#E0E0E0">Health OK?</text>

  <!-- "No" path (Rollback) -->
  <line x1="320" y1="490" x2="250" y2="490" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="285" y="485" text-anchor="middle" font-family="Arial" font-size="11" fill="#EF5350">No</text>
  <rect x="150" y="470" width="100" height="40" rx="5" fill="#E65100" />
  <text x="200" y="495" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Rollback</text>

  <!-- "Yes" path (Repeat) -->
  <line x1="400" y1="530" x2="400" y2="560" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="415" y="545" text-anchor="middle" font-family="Arial" font-size="11" fill="#4CAF50">Yes</text>

  <!-- Loop back path -->
  <path d="M 400 560 L 400 580 L 550 580 L 550 310 L 500 310" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="560" y="450" text-anchor="middle" font-family="Arial" font-size="12" fill="#888" transform="rotate(-90 560 450)">Next Server</text>

  <!-- Success Path -->
  <path d="M 300 310 L 100 310 L 100 620 L 350 620" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="110" y="450" text-anchor="middle" font-family="Arial" font-size="12" fill="#4CAF50" transform="rotate(90 110 450)">All Done</text>

  <!-- End Node -->
  <rect x="350" y="600" width="100" height="40" rx="20" fill="#4CAF50" filter="url(#shadow)" />
  <text x="400" y="625" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">Success</text>

</svg>
