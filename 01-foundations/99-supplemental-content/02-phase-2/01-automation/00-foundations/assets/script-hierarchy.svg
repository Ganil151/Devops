<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Mode Script Hierarchy Mindmap -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur" />
      <feOffset dx="0" dy="0" result="offsetblur" />
      <feFlood flood-color="#BB86FC" flood-opacity="0.3" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#121212" />

  <!-- Root -->
  <circle cx="400" cy="300" r="60" fill="#1e1e1e" stroke="#BB86FC" stroke-width="3" filter="url(#glow)" />
  <text x="400" y="295" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#BB86FC">Automation</text>
  <text x="400" y="315" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#BB86FC">Script</text>

  <!-- Branches -->
  
  <!-- Identity -->
  <path d="M 340 300 Q 250 250 180 150" stroke="#666" stroke-width="2" fill="none" />
  <rect x="100" y="100" width="120" height="40" rx="20" fill="#1e1e1e" stroke="#4CAF50" stroke-width="2" />
  <text x="160" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#4CAF50">Identity</text>
  <text x="230" y="100" font-family="Arial" font-size="11" fill="#888">• Shebang</text>
  <text x="230" y="115" font-family="Arial" font-size="11" fill="#888">• Extension</text>
  <text x="230" y="130" font-family="Arial" font-size="11" fill="#888">• Interpreter</text>

  <!-- Environment -->
  <path d="M 460 300 Q 550 250 620 150" stroke="#666" stroke-width="2" fill="none" />
  <rect x="580" y="100" width="120" height="40" rx="20" fill="#1e1e1e" stroke="#2196F3" stroke-width="2" />
  <text x="640" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2196F3">Environment</text>
  <text x="500" y="100" text-anchor="end" font-family="Arial" font-size="11" fill="#888">• Env Vars</text>
  <text x="500" y="115" text-anchor="end" font-family="Arial" font-size="11" fill="#888">• Secrets</text>
  <text x="500" y="130" text-anchor="end" font-family="Arial" font-size="11" fill="#888">• Pathing</text>

  <!-- Safety -->
  <path d="M 340 300 Q 250 350 180 450" stroke="#666" stroke-width="2" fill="none" />
  <rect x="100" y="450" width="120" height="40" rx="20" fill="#1e1e1e" stroke="#EF5350" stroke-width="2" />
  <text x="160" y="475" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#EF5350">Safety</text>
  <text x="230" y="455" font-family="Arial" font-size="11" fill="#888">• Error Handling</text>
  <text x="230" y="470" font-family="Arial" font-size="11" fill="#888">• Traps/Cleanups</text>
  <text x="230" y="485" font-family="Arial" font-size="11" fill="#888">• Validation</text>

  <!-- Output -->
  <path d="M 460 300 Q 550 350 620 450" stroke="#666" stroke-width="2" fill="none" />
  <rect x="580" y="450" width="120" height="40" rx="20" fill="#1e1e1e" stroke="#FF9800" stroke-width="2" />
  <text x="640" y="475" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FF9800">Output</text>
  <text x="500" y="455" text-anchor="end" font-family="Arial" font-size="11" fill="#888">• Log Files</text>
  <text x="500" y="470" text-anchor="end" font-family="Arial" font-size="11" fill="#888">• Stdout/Stderr</text>
  <text x="500" y="485" text-anchor="end" font-family="Arial" font-size="11" fill="#888">• Exit Status</text>

  <!-- Logic -->
  <path d="M 400 360 L 400 500" stroke="#666" stroke-width="2" fill="none" />
  <rect x="340" y="500" width="120" height="40" rx="20" fill="#1e1e1e" stroke="#03DAC6" stroke-width="2" />
  <text x="400" y="525" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#03DAC6">Logic</text>
  <text x="400" y="555" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">• If/Else • Loops • Case</text>

</svg>
