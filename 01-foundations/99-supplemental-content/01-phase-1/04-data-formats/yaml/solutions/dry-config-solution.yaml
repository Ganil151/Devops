# Challenge: DRY-ify this Config
# This solution uses YAML Anchors (&) and Aliases (*) to reduce repetition.

default_app_config: &base_config
  database_url: "localhost:5432"
  debug: true
  retry_count: 5

app_dev:
  <<: *base_config
  env: development

app_staging:
  <<: *base_config
  env: staging

app_prod:
  <<: *base_config
  env: production
