<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001E36;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" x="10" y="10" rx="30" fill="url(#grad1)" filter="url(#shadow)" />
  <path d="M50 70 L90 100 L50 130" stroke="white" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="100" y1="135" x2="150" y2="135" stroke="white" stroke-width="15" stroke-linecap="round" />
</svg>
