<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#0f172a" />
  
  <!-- Defs -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <!-- Lifecycle Step 1: Text File -->
  <g transform="translate(150, 200)">
    <rect x="-60" y="-80" width="120" height="160" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="0" y="-40" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">#!/bin/bash</text>
    <rect x="-40" y="-20" width="80" height="2" fill="#334155" />
    <rect x="-40" y="-10" width="60" height="2" fill="#334155" />
    <text x="0" y="100" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">1. TEXT FILE</text>
    <text x="0" y="120" fill="#64748b" font-family="Arial" font-size="11" text-anchor="middle">script.sh (644)</text>
  </g>

  <!-- Arrow -->
  <path d="M 230 200 L 320 200" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="275" y="185" fill="#3b82f6" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">chmod +x</text>

  <!-- Step 2: Executable -->
  <g transform="translate(420, 200)">
    <rect x="-60" y="-80" width="120" height="160" rx="5" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" filter="url(#glow)" />
    <text x="0" y="0" fill="#3b82f6" font-family="Arial" font-size="32" text-anchor="middle">🚀</text>
    <text x="0" y="100" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">2. EXECUTABLE</text>
    <text x="0" y="120" fill="#64748b" font-family="Arial" font-size="11" text-anchor="middle">script.sh (755)</text>
  </g>

  <!-- Arrow -->
  <path d="M 500 200 L 590 200" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="545" y="185" fill="#10b981" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">./run</text>

  <!-- Step 3: Kernel Handshake -->
  <g transform="translate(720, 200)">
    <circle r="70" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <text x="0" y="-10" fill="#ef4444" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">🐧 KERNEL</text>
    <text x="0" y="15" fill="#fca5a5" font-family="Arial" font-size="10" text-anchor="middle">Reads Shebang</text>
    <text x="0" y="100" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">3. INTERPRETATION</text>
  </g>

  <!-- Arrow -->
  <path d="M 810 200 L 900 200" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Step 4: Execution -->
  <g transform="translate(1020, 200)">
    <rect x="-80" y="-40" width="160" height="80" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="0" y="5" fill="#10b981" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">/bin/bash</text>
    <text x="0" y="100" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">4. RUNNING</text>
  </g>

  <!-- Footer -->
  <text x="1180" y="380" fill="#64748b" font-family="Arial" font-size="16" text-anchor="end" font-weight="bold">THE SCRIPT EXECUTION LIFECYCLE</text>
</svg>
