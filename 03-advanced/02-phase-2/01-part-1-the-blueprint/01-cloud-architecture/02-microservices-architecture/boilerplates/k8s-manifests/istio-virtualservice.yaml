---
# Istio VirtualService and DestinationRule
#
# This manifest demonstrates advanced traffic management with Istio:
# - Canary deployments (gradual rollout)
# - A/B testing (header-based routing)
# - Traffic splitting
# - Fault injection for resilience testing
#
# Architecture:
# ┌────────────────────────────────────────────────────┐
# │              API Gateway / Ingress                 │
# └────────────────┬───────────────────────────────────┘
#                  │
#                  ▼
#         ┌────────────────┐
#         │ VirtualService │
#         │ (Routing Rules)│
#         └────────┬───────┘
#                  │
#       ┌──────────┴──────────┐
#       │                     │
#       ▼                     ▼
# ┌──────────┐          ┌──────────┐
# │ Subset v1│          │ Subset v2│
# │  (90%)   │          │  (10%)   │
# └──────────┘          └──────────┘
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: order-service
  namespace: default
spec:
  hosts:
  - order-service
  - order-service.example.com  # External domain
  
  gateways:
  - mesh  # Internal mesh traffic
  - order-gateway  # External ingress traffic
  
  http:
  # Route 1: Canary testing (header-based)
  - match:
    - headers:
        canary:
          exact: "true"
    route:
    - destination:
        host: order-service
        subset: v2
      weight: 100
    timeout: 5s
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx,reset,connect-failure,refused-stream
  
  # Route 2: A/B testing (user segment)
  - match:
    - headers:
        x-user-segment:
          exact: "premium"
    route:
    - destination:
        host: order-service
        subset: v2
      weight: 50
    - destination:
        host: order-service
        subset: v1
      weight: 50
  
  # Route 3: Default traffic (canary rollout - 90/10 split)
  - route:
    - destination:
        host: order-service
        subset: v1
      weight: 90
    - destination:
        host: order-service
        subset: v2
      weight: 10
    
    # Global timeout
    timeout: 10s
    
    # Retry configuration
    retries:
      attempts: 3
      perTryTimeout: 3s
      retryOn: 5xx,reset,connect-failure
    
    # Fault injection for chaos engineering
    fault:
      delay:
        percentage:
          value: 0.1  # 10% of requests
        fixedDelay: 2s
      abort:
        percentage:
          value: 0.01  # 1% of requests
        httpStatus: 503
    
    # CORS policy
    corsPolicy:
      allowOrigins:
      - exact: https://example.com
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      allowHeaders:
      - content-type
      - authorization
      allowCredentials: true
      maxAge: 24h

---
# DestinationRule: Circuit breaker and load balancing
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: order-service
  namespace: default
spec:
  host: order-service
  
  # Traffic policy (applies to all subsets unless overridden)
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpHeaderName: x-user-id  # Session affinity by user ID
    
    # Connection pool settings
    connectionPool:
      tcp:
        maxConnections: 1000
      http:
        http1MaxPendingRequests: 1000
        http2MaxRequests: 1000
        maxRequestsPerConnection: 2
    
    # Circuit breaker
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    
    # TLS settings
    tls:
      mode: ISTIO_MUTUAL  # Mutual TLS
  
  # Subsets (versions)
  subsets:
  - name: v1
    labels:
      version: v1
    trafficPolicy:
      loadBalancer:
        simple: ROUND_ROBIN
  
  - name: v2
    labels:
      version: v2
    trafficPolicy:
      loadBalancer:
        simple: LEAST_REQUEST
      # Override circuit breaker for v2 (more tolerant during canary)
      outlierDetection:
        consecutive5xxErrors: 10
        interval: 60s

---
# Gateway: Ingress for external traffic
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: order-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - order-service.example.com
    # Redirect HTTP to HTTPS
    tls:
      httpsRedirect: true
  
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - order-service.example.com
    tls:
      mode: SIMPLE
      credentialName: order-service-tls-cert  # TLS certificate secret

---
# PeerAuthentication: Enforce mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: default
spec:
  mtls:
    mode: STRICT  # Require mTLS for all services

---
# AuthorizationPolicy: Fine-grained access control
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: order-service-authz
  namespace: default
spec:
  selector:
    matchLabels:
      app: order-service
  
  action: ALLOW
  
  rules:
  # Allow frontend-service to call order-service
  - from:
    - source:
        principals:
        - cluster.local/ns/default/sa/frontend-service
    to:
    - operation:
        methods:
        - GET
        - POST
        paths:
        - /api/orders
        - /api/orders/*
  
  # Allow admin service full access
  - from:
    - source:
        principals:
        - cluster.local/ns/default/sa/admin-service
    to:
    - operation:
        methods:
        - "*"

---
# ServiceEntry: External service registration
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-payment-gateway
  namespace: default
spec:
  hosts:
  - api.stripe.com
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS

---
# Example Deployment with version labels
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-v1
  namespace: default
spec:
  replicas: 9  # 90% of traffic
  selector:
    matchLabels:
      app: order-service
      version: v1
  template:
    metadata:
      labels:
        app: order-service
        version: v1
    spec:
      containers:
      - name: order-service
        image: order-service:1.0.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-v2
  namespace: default
spec:
  replicas: 1  # 10% of traffic (canary)
  selector:
    matchLabels:
      app: order-service
      version: v2
  template:
    metadata:
      labels:
        app: order-service
        version: v2
    spec:
      containers:
      - name: order-service
        image: order-service:2.0.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

---
# Service (required for Istio)
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
spec:
  selector:
    app: order-service  # Selects both v1 and v2
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
