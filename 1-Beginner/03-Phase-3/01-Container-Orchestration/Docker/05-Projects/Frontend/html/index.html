<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dockerized App</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f0f2f5;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #1a73e8;
        }

        .stats {
            margin-top: 1rem;
            font-size: 1.2rem;
            color: #5f6368;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Docker Full-Stack Project</h1>
        <p>This frontend is served by NGINX and communicates with a Flask backend.</p>
        <div id="stats" class="stats">Loading visitor stats...</div>
    </div>

    <script>
        // Fetch data from the Backend API
        fetch('/api/about')
            .then(response => response.json())
            .then(data => {
                document.getElementById('stats').innerText =
                    `App Version: ${data.app_version} | Total Visitors: ${data.visitor_count}`;
            })
            .catch(err => {
                document.getElementById('stats').innerText = "Backend API unreachable.";
            });
    </script>
</body>

</html>
