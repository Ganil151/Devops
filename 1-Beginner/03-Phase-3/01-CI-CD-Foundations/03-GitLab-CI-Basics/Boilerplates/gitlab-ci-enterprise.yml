# Enterprise GitLab CI/CD Pipeline
# Stored in the root of your repo as .gitlab-ci.yml

stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE: ganil151/devops-app:$CI_COMMIT_SHORT_SHA

# --- 1. BUILD STAGE ---
build_job:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Building Docker image..."
    - docker build -t $DOCKER_IMAGE .
    - # docker push $DOCKER_IMAGE
  artifacts:
    paths:
      - build_logs.txt
    expire_in: 1 week

# --- 2. TEST STAGE ---
unit_tests:
  stage: test
  image: python:3.10
  script:
    - pip install -r requirements.txt
    - pytest --cov=app tests/
  coverage: '/TOTAL.*\s+(\d+%) /'

# --- 3. DEPLOY STAGE ---
deploy_to_staging:
  stage: deploy
  environment:
    name: staging
    url: https://staging.example.com
  only:
    - dev
  script:
    - echo "Deploying to Staging Server..."
    - # ssh deployer@staging "docker pull $DOCKER_IMAGE && docker-compose up -d"

deploy_to_production:
  stage: deploy
  environment:
    name: production
    url: https://prod.example.com
  only:
    - main
  when: manual # REQUIRES MANUAL APPROVAL IN UI
  script:
    - echo "Deploying to Production Cloud..."
