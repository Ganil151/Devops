name: Enterprise Python CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- 1. THE BUILD & TEST JOB ---
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # AUTO-CACHING ENABLED: Saves 'pip' cache between runs
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pytest
        run: |
          echo "Running tests for Python ${{ matrix.python-version }}..."
          # pytest --junitxml=reports/test-results.xml

      - name: Upload Artifacts
        if: always() # Run even if tests fail to see the logs
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: reports/

  # --- 2. THE DEPLOY JOB (Runs only after build) ---
  deployment:
    needs: build_and_test
    if: github.ref == 'refs/heads/main' # Only deploy if on main branch
    runs-on: ubuntu-latest
    
    # LINK TO GITHUB ENVIRONMENT FOR APPROVALS
    environment: Production
    
    steps:
      - name: Deploy to Cloud
        env:
          MY_SECRET_TOKEN: ${{ secrets.PROD_API_KEY }}
        run: |
          echo "Connecting to Production Infrastructure..."
          echo "Deploying stable build to AWS/ECR..."
          # ./deploy.sh --token $MY_SECRET_TOKEN
