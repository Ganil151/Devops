<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #1a1a1a; }
      .text { fill: #ffffff; font-family: Arial, sans-serif; font-size: 14px; }
      .title { fill: #ffffff; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
      .input-box { fill: #2d5aa0; stroke: #4a90e2; stroke-width: 2; }
      .process-box { fill: #d35400; stroke: #e67e22; stroke-width: 2; }
      .output-box { fill: #27ae60; stroke: #2ecc71; stroke-width: 2; }
      .error-box { fill: #c0392b; stroke: #e74c3c; stroke-width: 2; }
      .arrow { stroke: #ffffff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" class="bg"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Stream Architecture in Shell Scripting</text>
  
  <!-- Input Sources -->
  <text x="80" y="70" text-anchor="middle" class="title">Input Sources</text>
  
  <rect x="20" y="80" width="120" height="40" rx="5" class="input-box"/>
  <text x="80" y="105" text-anchor="middle" class="text">Keyboard</text>
  
  <rect x="20" y="130" width="120" height="40" rx="5" class="input-box"/>
  <text x="80" y="155" text-anchor="middle" class="text">File</text>
  
  <rect x="20" y="180" width="120" height="40" rx="5" class="input-box"/>
  <text x="80" y="205" text-anchor="middle" class="text">Pipe</text>
  
  <rect x="20" y="230" width="120" height="40" rx="5" class="input-box"/>
  <text x="80" y="255" text-anchor="middle" class="text">Here Doc</text>
  
  <!-- Process Section -->
  <text x="400" y="70" text-anchor="middle" class="title">Process Execution</text>
  
  <!-- stdin -->
  <rect x="200" y="120" width="100" height="50" rx="5" class="input-box"/>
  <text x="250" y="140" text-anchor="middle" class="text">stdin</text>
  <text x="250" y="155" text-anchor="middle" class="text">(FD 0)</text>
  
  <!-- Command/Script -->
  <rect x="340" y="140" width="120" height="60" rx="5" class="process-box"/>
  <text x="400" y="165" text-anchor="middle" class="text">Command /</text>
  <text x="400" y="180" text-anchor="middle" class="text">Script</text>
  
  <!-- stdout -->
  <rect x="500" y="100" width="100" height="50" rx="5" class="output-box"/>
  <text x="550" y="120" text-anchor="middle" class="text">stdout</text>
  <text x="550" y="135" text-anchor="middle" class="text">(FD 1)</text>
  
  <!-- stderr -->
  <rect x="500" y="180" width="100" height="50" rx="5" class="error-box"/>
  <text x="550" y="200" text-anchor="middle" class="text">stderr</text>
  <text x="550" y="215" text-anchor="middle" class="text">(FD 2)</text>
  
  <!-- Output Destinations -->
  <text x="720" y="70" text-anchor="middle" class="title">Destinations</text>
  
  <rect x="660" y="80" width="120" height="40" rx="5" class="output-box"/>
  <text x="720" y="105" text-anchor="middle" class="text">Terminal</text>
  
  <rect x="660" y="130" width="120" height="40" rx="5" class="output-box"/>
  <text x="720" y="155" text-anchor="middle" class="text">File</text>
  
  <rect x="660" y="180" width="120" height="40" rx="5" class="output-box"/>
  <text x="720" y="205" text-anchor="middle" class="text">Pipe</text>
  
  <rect x="660" y="230" width="120" height="40" rx="5" class="output-box"/>
  <text x="720" y="255" text-anchor="middle" class="text">/dev/null</text>
  
  <!-- Arrows -->
  <!-- Input to stdin -->
  <line x1="140" y1="100" x2="200" y2="140" class="arrow"/>
  <line x1="140" y1="150" x2="200" y2="145" class="arrow"/>
  <line x1="140" y1="200" x2="200" y2="150" class="arrow"/>
  <line x1="140" y1="250" x2="200" y2="155" class="arrow"/>
  
  <!-- stdin to process -->
  <line x1="300" y1="145" x2="340" y2="160" class="arrow"/>
  
  <!-- process to stdout/stderr -->
  <line x1="460" y1="155" x2="500" y2="125" class="arrow"/>
  <line x1="460" y1="185" x2="500" y2="205" class="arrow"/>
  
  <!-- stdout/stderr to destinations -->
  <line x1="600" y1="115" x2="660" y2="100" class="arrow"/>
  <line x1="600" y1="125" x2="660" y2="150" class="arrow"/>
  <line x1="600" y1="135" x2="660" y2="200" class="arrow"/>
  <line x1="600" y1="145" x2="660" y2="250" class="arrow"/>
  
  <line x1="600" y1="195" x2="660" y2="100" class="arrow"/>
  <line x1="600" y1="205" x2="660" y2="150" class="arrow"/>
  <line x1="600" y1="215" x2="660" y2="200" class="arrow"/>
  <line x1="600" y1="225" x2="660" y2="250" class="arrow"/>
  
  <!-- Legend -->
  <text x="50" y="330" class="title">Key Redirection Patterns:</text>
  <text x="50" y="350" class="text">• command > file (redirect stdout)</text>
  <text x="50" y="365" class="text">• command 2> file (redirect stderr)</text>
  <text x="50" y="380" class="text">• command &> file (redirect both)</text>
  
  <text x="400" y="350" class="text">• command 2>&1 (stderr to stdout)</text>
  <text x="400" y="365" class="text">• command | tee file (output to both)</text>
  <text x="400" y="380" class="text">• command > /dev/null (discard output)</text>
</svg>