<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="500" fill="#0f172a" />
  
  <!-- Defs -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Central Mode: NORMAL -->
  <g transform="translate(600, 250)">
    <rect x="-120" y="-40" width="240" height="80" rx="40" fill="#1e293b" stroke="#3b82f6" stroke-width="4" filter="url(#glow)" />
    <text x="0" y="-5" fill="#3b82f6" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">NORMAL MODE</text>
    <text x="0" y="20" fill="#94a3b8" font-family="Arial" font-size="12" text-anchor="middle">Navigation & Surgery (Default)</text>
  </g>

  <!-- INSERT Mode (Top) -->
  <g transform="translate(600, 80)">
    <rect x="-100" y="-30" width="200" height="60" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="0" y="5" fill="#10b981" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">INSERT MODE</text>
    <text x="0" y="22" fill="#6ee7b7" font-family="Arial" font-size="10" text-anchor="middle">"i, a, o" to enter</text>
  </g>
  <!-- Arrows Normal <-> Insert -->
  <path d="M 580 210 L 580 110" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="570" y="160" fill="#10b981" font-family="Arial" font-size="12" text-anchor="end">i</text>
  <path d="M 620 110 L 620 210" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="630" y="160" fill="#94a3b8" font-family="Arial" font-size="12" text-anchor="start">Esc</text>

  <!-- VISUAL Mode (Left) -->
  <g transform="translate(250, 250)">
    <rect x="-100" y="-30" width="200" height="60" rx="10" fill="#4c1d95" stroke="#8b5cf6" stroke-width="2" />
    <text x="0" y="5" fill="#8b5cf6" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">VISUAL MODE</text>
    <text x="0" y="22" fill="#ddd6fe" font-family="Arial" font-size="10" text-anchor="middle">"v" or "Ctrl-v" to enter</text>
  </g>
  <!-- Arrows Normal <-> Visual -->
  <path d="M 480 240 L 350 240" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="415" y="235" fill="#8b5cf6" font-family="Arial" font-size="12" text-anchor="middle">v</text>
  <path d="M 350 260 L 480 260" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="415" y="275" fill="#94a3b8" font-family="Arial" font-size="12" text-anchor="middle">Esc</text>

  <!-- COMMAND Mode (Right) -->
  <g transform="translate(950, 250)">
    <rect x="-100" y="-30" width="200" height="60" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <text x="0" y="5" fill="#ef4444" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">COMMAND MODE</text>
    <text x="0" y="22" fill="#fca5a5" font-family="Arial" font-size="10" text-anchor="middle">":" to enter</text>
  </g>
  <!-- Arrows Normal <-> Command -->
  <path d="M 720 240 L 850 240" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="785" y="235" fill="#ef4444" font-family="Arial" font-size="12" text-anchor="middle">:</text>
  <path d="M 850 260 L 720 260" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="785" y="275" fill="#94a3b8" font-family="Arial" font-size="12" text-anchor="middle">Enter</text>

  <!-- Title Bottom -->
  <text x="1180" y="480" fill="#64748b" font-family="Arial" font-size="16" text-anchor="end" font-weight="bold">VIM STATE DIAGRAM (THE 4 MODES)</text>
</svg>
