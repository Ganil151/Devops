<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for markers and filters -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e0e0e0" />
    </marker>
    <style>
      .bg { fill: #1e1e1e; }
      .box { fill: #2d2d2d; stroke: #4caf50; stroke-width: 2; rx: 8; ry: 8; }
      .box-process { fill: #2d2d2d; stroke: #2196f3; stroke-width: 2; rx: 8; ry: 8; }
      .box-error { fill: #2d2d2d; stroke: #f44336; stroke-width: 2; rx: 8; ry: 8; }
      .text { fill: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
      .title { fill: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .label { fill: #aaaaaa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #e0e0e0; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Main Title -->
  <text x="400" y="35" class="title">Standard Streams &amp; Redirection Architecture</text>

  <!-- Input Side -->
  <text x="100" y="75" class="title" style="font-size: 16px;">Input Sources</text>
  
  <rect x="50" y="100" width="100" height="40" class="box" stroke="#bb86fc" />
  <text x="100" y="120" class="text">Keyboard</text>

  <rect x="50" y="160" width="100" height="40" class="box" stroke="#bb86fc" />
  <text x="100" y="180" class="text">File</text>

  <rect x="50" y="220" width="100" height="40" class="box" stroke="#bb86fc" />
  <text x="100" y="240" class="text">Pipe</text>

  <!-- Process Center -->
  <rect x="250" y="130" width="300" height="200" fill="#252526" stroke="#555" stroke-width="2" rx="10" />
  <text x="400" y="150" class="title" style="font-size: 16px;">Running Process (PID)</text>

  <!-- STDIN -->
  <rect x="270" y="180" width="80" height="50" class="box" />
  <text x="310" y="200" class="text">STDIN</text>
  <text x="310" y="220" class="label">FD 0</text>

  <!-- STDOUT -->
  <rect x="450" y="170" width="80" height="50" class="box" />
  <text x="490" y="190" class="text">STDOUT</text>
  <text x="490" y="210" class="label">FD 1</text>

  <!-- STDERR -->
  <rect x="450" y="250" width="80" height="50" class="box-error" />
  <text x="490" y="270" class="text">STDERR</text>
  <text x="490" y="290" class="label">FD 2</text>
  
  <!-- Output Side -->
  <text x="700" y="75" class="title" style="font-size: 16px;">Destinations</text>

  <rect x="650" y="100" width="100" height="40" class="box" stroke="#03dac6" />
  <text x="700" y="120" class="text">Terminal</text>

  <rect x="650" y="160" width="100" height="40" class="box" stroke="#03dac6" />
  <text x="700" y="180" class="text">File</text>

  <rect x="650" y="220" width="100" height="40" class="box" stroke="#03dac6" />
  <text x="700" y="240" class="text">Pipe</text>

  <rect x="650" y="280" width="100" height="40" class="box" stroke="#03dac6" />
  <text x="700" y="300" class="text">/dev/null</text>

  <!-- Connections -->
  <!-- Inputs to STDIN -->
  <path d="M 150 120 C 200 120, 200 205, 270 205" class="arrow" />
  <path d="M 150 180 C 180 180, 220 205, 270 205" class="arrow" />
  <path d="M 150 240 C 200 240, 200 205, 270 205" class="arrow" />

  <!-- STDOUT to Destinations -->
  <path d="M 530 195 C 580 195, 580 120, 640 120" class="arrow" />
  <path d="M 530 195 C 580 195, 580 180, 640 180" class="arrow" />
  <path d="M 530 195 C 580 195, 580 240, 640 240" class="arrow" />

  <!-- STDERR to Destinations -->
  <path d="M 530 275 C 580 275, 580 120, 640 120" class="arrow" stroke-dasharray="4" />
  <path d="M 530 275 C 580 275, 580 180, 640 180" class="arrow" stroke-dasharray="4" />
  <path d="M 530 275 C 580 275, 580 300, 640 300" class="arrow" stroke-dasharray="4" />

  <!-- Legend -->
  <rect x="50" y="380" width="700" height="100" fill="#252526" rx="5" />
  <text x="400" y="395" class="title" style="font-size: 14px;">Redirection Cheat Sheet</text>
  
  <text x="100" y="420" class="text" style="text-anchor:start; font-family: monospace;">&gt; File</text>
  <text x="200" y="420" class="text" style="text-anchor:start;">Redirect STDOUT</text>

  <text x="100" y="440" class="text" style="text-anchor:start; font-family: monospace;">2&gt; File</text>
  <text x="200" y="440" class="text" style="text-anchor:start;">Redirect STDERR</text>

  <text x="100" y="460" class="text" style="text-anchor:start; font-family: monospace;">&amp;&gt; File</text>
  <text x="200" y="460" class="text" style="text-anchor:start;">Redirect Both</text>

  <text x="450" y="420" class="text" style="text-anchor:start; font-family: monospace;">2&gt;&amp;1</text>
  <text x="550" y="420" class="text" style="text-anchor:start;">STDERR to STDOUT</text>

  <text x="450" y="440" class="text" style="text-anchor:start; font-family: monospace;">| (pipe)</text>
  <text x="550" y="440" class="text" style="text-anchor:start;">STDOUT to Next STDIN</text>

  <text x="450" y="460" class="text" style="text-anchor:start; font-family: monospace;">&lt; File</text>
  <text x="550" y="460" class="text" style="text-anchor:start;">File to STDIN</text>
</svg>