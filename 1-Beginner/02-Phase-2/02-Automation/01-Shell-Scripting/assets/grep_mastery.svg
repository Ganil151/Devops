<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#0f172a" />
  
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Code/Log Stream (Background) -->
  <g opacity="0.15" font-family="monospace" font-size="12" fill="#94a3b8">
    <text x="50" y="50">2026-01-11 01:23:44 INFO Initializing subsystem...</text>
    <text x="50" y="75">2026-01-11 01:23:45 DEBUG Checking configuration...</text>
    <text x="50" y="100">2026-01-11 01:23:46 WARN Deprecated API usage at line 44</text>
    <text x="50" y="125">2026-01-11 01:23:47 ERROR Connection failed: Timeout</text>
    <text x="50" y="150">2026-01-11 01:23:48 INFO Retrying in 5 seconds...</text>
    <text x="50" y="175">2026-01-11 01:23:49 DEBUG Memory allocation: 512MB</text>
    <text x="50" y="200">2026-01-11 01:23:50 INFO Initializing subsystem...</text>
    <text x="50" y="225">2026-01-11 01:23:51 ERROR FATAL: Database unreachable</text>
    <text x="50" y="250">2026-01-11 01:23:52 DEBUG Stack trace follows...</text>
    <text x="50" y="275">2026-01-11 01:23:53 INFO System shutdown initiated.</text>
    <!-- Repeat across -->
    <text x="600" y="60">ls -la /var/log/nginx/access.log</text>
    <text x="600" y="85">grep -r "AKIA" . --exclude-dir=node_modules</text>
    <text x="600" y="110">tail -f /var/log/syslog | grep "auth"</text>
  </g>

  <!-- Magnifying Glass (The Search Tool) -->
  <g transform="translate(600, 200)">
    <!-- Handle -->
    <rect x="-10" y="50" width="20" height="100" rx="5" fill="#334155" transform="rotate(-45)" />
    <!-- Frame -->
    <circle cx="0" cy="0" r="100" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="8" filter="url(#glow)" />
    <!-- Lens Reflection -->
    <path d="M -60 -40 Q -70 -20 -60 0" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3" />
    
    <!-- Match Found! -->
    <rect x="-80" y="-15" width="160" height="30" rx="4" fill="#ef4444" filter="url(#glow)" />
    <text x="0" y="6" fill="#ffffff" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">MATCH: "ERROR"</text>
  </g>

  <!-- Side Keywords -->
  <g transform="translate(100, 320)">
    <text x="0" y="0" fill="#3b82f6" font-family="Arial" font-size="14" font-weight="bold">CASE INSENSITIVE (-i)</text>
    <text x="0" y="30" fill="#10b981" font-family="Arial" font-size="14" font-weight="bold">RECURSIVE (-r)</text>
    <text x="0" y="60" fill="#f59e0b" font-family="Arial" font-size="14" font-weight="bold">INVERT MATCH (-v)</text>
  </g>

  <g transform="translate(900, 320)">
    <text x="0" y="0" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold" text-anchor="end">GREP MASTERY</text>
    <text x="0" y="30" fill="#64748b" font-family="Arial" font-size="14" text-anchor="end">THE ART OF GLOBAL SEARCH</text>
  </g>

</svg>
