<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#0f172a" />
  
  <!-- Grid Lines for High Tech Look -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Disk Source -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="90" y="45" fill="#3b82f6" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">📄 LOG FILE</text>
    <text x="90" y="70" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">(100GB on Disk)</text>
  </g>

  <!-- Arrow 1: File Descriptor -->
  <path d="M 280 200 L 400 200" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="340" y="185" fill="#94a3b8" font-family="Arial" font-size="11" text-anchor="middle">File Descriptor</text>

  <!-- Linux Kernel -->
  <g transform="translate(420, 130)">
    <circle cx="70" cy="70" r="60" fill="#0f172a" stroke="#ef4444" stroke-width="3" />
    <text x="70" y="65" fill="#ef4444" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">🐧 KERNEL</text>
    <text x="70" y="85" fill="#991b1b" font-family="Arial" font-size="10" text-anchor="middle">MMAP / BUFFER</text>
  </g>

  <!-- Arrow 2: Pager Access -->
  <path d="M 560 200 L 680 200" stroke="#64748b" stroke-width="2" />
  <text x="620" y="185" fill="#94a3b8" font-family="Arial" font-size="11" text-anchor="middle">Memory Map</text>

  <!-- Less Pager -->
  <g transform="translate(700, 150)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="2" />
    <text x="90" y="45" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">📜 PAGER: LESS</text>
    <text x="90" y="70" fill="#bfdbfe" font-family="Arial" font-size="11" text-anchor="middle">Lazy Loading (Fixed RAM)</text>
  </g>

  <!-- Arrow 3: Terminal View -->
  <path d="M 880 200 L 1000 200" stroke="#64748b" stroke-width="2" />

  <!-- Terminal Screen -->
  <g transform="translate(1020, 130)">
    <rect x="0" y="0" width="120" height="140" rx="5" fill="#000000" stroke="#10b981" stroke-width="2" />
    <rect x="5" y="5" width="110" height="15" rx="2" fill="#1e293b" />
    <circle cx="15" cy="12" r="3" fill="#ef4444" />
    <circle cx="25" cy="12" r="3" fill="#f59e0b" />
    <circle cx="35" cy="12" r="3" fill="#10b981" />
    
    <!-- Code Lines -->
    <rect x="10" y="35" width="80" height="4" rx="2" fill="#10b981" opacity="0.8" />
    <rect x="10" y="45" width="60" height="4" rx="2" fill="#10b981" opacity="0.4" />
    <rect x="10" y="55" width="90" height="4" rx="2" fill="#10b981" opacity="0.8" />
    <rect x="10" y="65" width="40" height="4" rx="2" fill="#10b981" opacity="0.6" />
    
    <text x="60" y="125" fill="#10b981" font-family="Courier New" font-size="10" text-anchor="middle">ViewPort</text>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

</svg>
