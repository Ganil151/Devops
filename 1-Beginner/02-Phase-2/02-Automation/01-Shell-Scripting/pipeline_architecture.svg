<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Mode Pipeline Design -->
  <defs>
    <linearGradient id="cmdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1e1e;stop-opacity:1" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
      <feFlood flood-color="#4CAF50" flood-opacity="0.3" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
      <feFlood flood-color="#FF9800" flood-opacity="0.3" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#121212" />

  <!-- Command 1 -->
  <g transform="translate(40, 60)">
    <rect width="180" height="80" rx="10" fill="url(#cmdGrad)" stroke="#4CAF50" stroke-width="2" filter="url(#glowGreen)" />
    <text x="90" y="30" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#BB86FC">Command 1</text>
    <text x="90" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#E0E0E0">cat logfile.txt</text>
  </g>

  <!-- Pipe 1 -->
  <g transform="translate(235, 80)">
    <rect width="30" height="40" rx="5" fill="#333" stroke="#FF9800" stroke-width="2" />
    <text x="15" y="26" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#FF9800" font-size="20">|</text>
  </g>

  <!-- Command 2 -->
  <g transform="translate(280, 60)">
    <rect width="180" height="80" rx="10" fill="url(#cmdGrad)" stroke="#2196F3" stroke-width="2" />
    <text x="90" y="30" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#BB86FC">Command 2</text>
    <text x="90" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#E0E0E0">grep "ERROR"</text>
  </g>

  <!-- Pipe 2 -->
  <g transform="translate(475, 80)">
    <rect width="30" height="40" rx="5" fill="#333" stroke="#FF9800" stroke-width="2" />
    <text x="15" y="26" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#FF9800" font-size="20">|</text>
  </g>

  <!-- Command 3 -->
  <g transform="translate(520, 60)">
    <rect width="180" height="80" rx="10" fill="url(#cmdGrad)" stroke="#EF5350" stroke-width="2" />
    <text x="90" y="30" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#BB86FC">Command 3</text>
    <text x="90" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#E0E0E0">wc -l</text>
  </g>

  <!-- Data Flow Labels -->
  <g transform="translate(0, 180)">
    <path d="M 130 0 L 130 30" stroke="#666" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow)" />
    <text x="130" y="50" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">Raw Log Data</text>

    <path d="M 370 0 L 370 30" stroke="#666" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow)" />
    <text x="370" y="50" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">Filtered Errors</text>

    <path d="M 610 0 L 610 30" stroke="#666" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow)" />
    <text x="610" y="50" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">Count (Result)</text>
  </g>

  <!-- Final Output Bubble -->
  <path d="M 700 100 L 740 100" stroke="#03DAC6" stroke-width="2" marker-end="url(#arrowCyan)" />
  <circle cx="760" cy="100" r="15" fill="#03DAC6" filter="url(#glowCyan)" />
  <text x="760" y="105" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#121212" font-size="12">12</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#03DAC6" />
    </marker>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feFlood flood-color="#03DAC6" flood-opacity="0.5" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
</svg>
