apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-security-audit
  namespace: automation
spec:
  # 1. Schedule: Every night at 2:00 AM
  schedule: "0 2 * * *"
  
  # 2. Concurrency Policy: 'Forbid' ensures that if the audit takes > 24 hours,
  #    a second job is NOT started. This is critical for data integrity.
  concurrencyPolicy: Forbid
  
  # 3. Successful Jobs History: Keep the last 3 records for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: auditor
            image: devops-tools/security-scanner:v1.2
            imagePullPolicy: IfNotPresent
            args:
            - /bin/sh
            - -c
            - "python3 /app/audit.py --mode=full"
            env:
            - name: LOG_LEVEL
              value: "INFO"
          
          # 4. Restart Policy: If the container fails, retry it.
          restartPolicy: OnFailure
