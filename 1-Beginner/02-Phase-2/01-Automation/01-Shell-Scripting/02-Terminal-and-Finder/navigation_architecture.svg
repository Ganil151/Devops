<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="500" fill="#0f172a" />
  
  <!-- Divider -->
  <line x1="600" y1="50" x2="600" y2="450" stroke="#1e293b" stroke-width="2" />

  <!-- Left Side: Navigation Concepts -->
  <text x="300" y="80" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">📍 NAVIGATION CONCEPTS</text>
  
  <g transform="translate(100, 150)">
    <!-- Root -->
    <circle cx="50" cy="50" r="40" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <text x="50" y="58" fill="#ffffff" font-family="monospace" font-size="32" text-anchor="middle" font-weight="bold">/</text>
    <text x="100" y="55" fill="#ef4444" font-family="Arial" font-size="14" font-weight="bold">ROOT</text>

    <!-- Home -->
    <rect x="10" y="150" width="80" height="60" rx="5" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <text x="50" y="185" fill="#ffffff" font-family="monospace" font-size="32" text-anchor="middle">~</text>
    <text x="100" y="185" fill="#3b82f6" font-family="Arial" font-size="14" font-weight="bold">HOME</text>

    <!-- PWD -->
    <rect x="0" y="250" width="400" height="40" rx="5" fill="#1e293b" stroke="#64748b" />
    <text x="10" y="275" fill="#10b981" font-family="monospace" font-size="14">pwd:</text>
    <text x="50" y="275" fill="#ffffff" font-family="monospace" font-size="14"> /home/user/documents/devops</text>
  </g>

  <!-- Right Side: Essential Commands -->
  <text x="900" y="80" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">🛠️ NAVIGATION TOOLS</text>

  <g transform="translate(750, 130)">
    <rect x="0" y="0" width="300" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="20" y="25" fill="#3b82f6" font-family="monospace" font-size="18" font-weight="bold">cd [path]</text>
    <text x="20" y="48" fill="#94a3b8" font-family="Arial" font-size="12">Change Directory (Move around)</text>
    
    <rect x="0" y="80" width="300" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="20" y="105" fill="#10b981" font-family="monospace" font-size="18" font-weight="bold">ls -lah</text>
    <text x="20" y="128" fill="#94a3b8" font-family="Arial" font-size="12">List files (Detailed & Hidden)</text>

    <rect x="0" y="160" width="300" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="20" y="185" fill="#f59e0b" font-family="monospace" font-size="18" font-weight="bold">pwd</text>
    <text x="20" y="208" fill="#94a3b8" font-family="Arial" font-size="12">Print Working Directory (Where am I?)</text>
  </g>

  <!-- Footer -->
  <text x="1180" y="480" fill="#64748b" font-family="Arial" font-size="16" text-anchor="end" font-weight="bold">UNIX NAVIGATION ARCHITECTURE</text>
</svg>
