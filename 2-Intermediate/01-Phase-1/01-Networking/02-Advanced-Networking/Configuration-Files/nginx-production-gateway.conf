# ==========================================
# NRE Standard: Production Gateway (Nginx)
# ==========================================
# Why this is better than default:
# 1. Hides Nginx Version (Security)
# 2. Passes Real IP Headers (Observability)
# 3. Aggressive Timeouts (Fail Fast)
# 4. Gzip Compression (Speed)
# ==========================================

http {
    # 1. Basic Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 2. Security: Don't tell hackers we run Nginx 1.18.0
    server_tokens off;

    # 3. Upstream Definition (The Backend)
    upstream backend_app {
        # Least Conn: Send traffic to the server doing the LEAST work
        least_conn;
        
        server 10.0.1.10:8080 max_fails=3 fail_timeout=5s;
        server 10.0.1.11:8080 max_fails=3 fail_timeout=5s;
        
        # Keepalive: Maintain 32 open TCP connections to backend
        # (Saves CPU on Handshakes)
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.company.com;

        # 4. The "Block" Logic
        location / {
            proxy_pass http://backend_app;

            # 5. Header Hygiene (Crucial for Logs)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 6. Fail Fast Timeouts
            # If backend doesn't connect in 2s, give up.
            proxy_connect_timeout 2s;
            # If backend accepts but doesn't reply in 5s, give up.
            proxy_read_timeout 5s;

            # 7. Don't cache errors
            proxy_intercept_errors on;
            error_page 502 503 504 /custom_50x.html;
        }

        # 8. Health Check Endpoint (For ALB)
        location /healthz {
            access_log off;
            return 200 "OK";
        }
    }
}
