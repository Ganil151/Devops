# ==========================================
# NRE Standard: Linux Kernel Tuning (Sysctl)
# ==========================================
# Location: /etc/sysctl.d/99-networking.conf
# Apply with: sudo sysctl -p
# ==========================================

# 1. Increase the Queue (Backlog)
# Default is often 128. If 129 people connect instantly, #129 gets "Connection Refused".
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 4096

# 2. Ephemeral Ports (The "Out of Ports" Fix)
# Default range is small. We open it up for high-scale egress.
net.ipv4.ip_local_port_range = 1024 65535

# 3. TIME_WAIT Recycling (Dangerous but necessary for high-throughput)
# Allows reusing a socket even if it's in TIME_WAIT state.
# ONLY use this if you know what you are doing (e.g., dedicated Load Balancer).
net.ipv4.tcp_tw_reuse = 1

# 4. Memory Tuning (Don't starve the buffer)
# Max TCP Receive/Send Buffer (16MB)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# 5. Security (Anti-Spoofing)
# Drop packets that claim to be from the internet but have a private source IP.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# 6. Stop ICMP Redirects (Man-in-the-Middle Protection)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
