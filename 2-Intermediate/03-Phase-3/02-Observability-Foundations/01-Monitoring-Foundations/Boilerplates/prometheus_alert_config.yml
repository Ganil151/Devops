# Observability Boilerplate: Prometheus Configuration
# File: prometheus.yml

global:
  scrape_interval: 15s # How often to fetch metrics
  evaluation_interval: 15s

# --- 1. ALERT RULES ---
rule_files:
  - "alert_rules.yml"

# --- 2. SCRAPE TARGETS ---
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "application"
    metrics_path: "/actuator/prometheus" # Common for Spring Boot
    static_configs:
      - targets: ["app-server:8080"]

---

# File: alert_rules.yml (Example Rule)

groups:
- name: Infrastructure_Alerts
  rules:
  - alert: HighCPUUsage
    expr: node_cpu_seconds_total{mode="idle"} < 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU load detected on {{ $labels.instance }}"
      description: "CPU usage is above 90% for more than 5 minutes."

  - alert: InstanceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Critical: Instance {{ $labels.instance }} is down"
