# K8s Workload Boilerplate: Scalable Web Deployment

# --- 1. THE YAML MANIFEST ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-web
  labels:
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  
  # STRATEGY FOR ZERO-DOWNTIME UPDATES
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # How many extra pods to spin up during update
      maxUnavailable: 0 # Ensure we always have full availability

  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.16.1
        ports:
        - containerPort: 80
        
        # RESOURCE LIMITS (VITAL FOR PRODUCTION)
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"

        # LIVENESS & READINESS CHECKS
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20

---

# CLI Rollout Commands
1. `kubectl apply -f deployment.yaml` - Deploy or Update.
2. `kubectl rollout undo deployment production-web` - Rollback to previous version.
3. `kubectl rollout history deployment production-web` - View version history.
