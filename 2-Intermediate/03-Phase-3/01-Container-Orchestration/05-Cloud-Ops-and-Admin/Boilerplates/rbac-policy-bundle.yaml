# K8s Administration Boilerplate: RBAC Limited Access

# --- 1. THE SERVICE ACCOUNT ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-reader
  namespace: default

---

# --- 2. THE ROLE (Permissions) ---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: pod-reader
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]

---

# --- 3. THE BINDING (Link) ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-global
  namespace: default
subjects:
- kind: ServiceAccount
  name: cluster-reader
  namespace: default
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

---

# Multi-Namespace Control
To apply these permissions across the ENTIRE cluster instead of just one namespace, change:
1. `kind: Role` -> `kind: ClusterRole`
2. `kind: RoleBinding` -> `kind: ClusterRoleBinding`
3. Remove the `namespace: default` from the metadata.
