<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Definitions for Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568" />
    </marker>
  </defs>

  <!-- Nodes -->
  <!-- A: Detection -->
  <rect x="50" y="50" width="180" height="60" rx="8" fill="#e53e3e" />
  <text x="140" y="85" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">1. Detection</text>
  <text x="140" y="102" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Monitoring Alert</text>

  <!-- B: Identification -->
  <rect x="310" y="50" width="180" height="60" rx="8" fill="#dd6b20" />
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">2. Identification</text>
  <text x="400" y="102" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Apply Runbook</text>

  <!-- C: Execution -->
  <rect x="570" y="50" width="180" height="60" rx="8" fill="#3182ce" />
  <text x="660" y="85" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">3. Execution</text>
  <text x="660" y="102" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Follow the steps</text>

  <!-- D: Resolution -->
  <rect x="570" y="250" width="180" height="60" rx="8" fill="#38a169" />
  <text x="660" y="285" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">4. Resolution</text>
  <text x="660" y="302" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Service Healthy?</text>

  <!-- E: Post-Mortem -->
  <rect x="310" y="250" width="180" height="60" rx="8" fill="#805ad5" />
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">5. Post-Mortem</text>
  <text x="400" y="302" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Root Cause Analysis</text>

  <!-- F: Improvement -->
  <rect x="50" y="250" width="180" height="60" rx="8" fill="#718096" />
  <text x="140" y="285" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">6. Improvement</text>
  <text x="140" y="302" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Update Runbook</text>

  <!-- Connectors -->
  <line x1="230" y1="80" x2="300" y2="80" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="490" y1="80" x2="560" y2="80" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="660" y1="110" x2="660" y2="240" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="570" y1="280" x2="500" y2="280" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="310" y1="280" x2="240" y2="280" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="140" y1="250" x2="140" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" />

</svg>
