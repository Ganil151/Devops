---
- name: Logic Demo
  hosts: localhost
  vars:
    users:
      - { name: 'alice', groups: 'wheel' }
      - { name: 'bob', groups: 'dev' }
    
    production: false

  tasks:
    # 1. LOOPS (Creating multiple items)
    - name: Create users
      user:
        name: "{{ item.name }}"
        groups: "{{ item.groups }}"
        state: present
      loop: "{{ users }}"

    # 2. CONDITIONALS (Skipping tasks)
    - name: Install Debug Tools
      package:
        name: htop
        state: present
      when: not production  # Only run if production is false

    # 3. REGISTER + WHEN (Reacting to output)
    - name: Check if file exists
      stat:
        path: /tmp/flag
      register: file_check

    - name: Create flag if missing
      file:
        path: /tmp/flag
        state: touch
      when: not file_check.stat.exists
