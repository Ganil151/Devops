<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for markers and filters -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Node: Error -->
  <g transform="translate(300, 50)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="60" rx="10" ry="10" fill="#ff6b6b" stroke="#333" stroke-width="2"/>
    <text x="100" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Terraform Command Fails</text>
  </g>

  <!-- Node: Identify -->
  <g transform="translate(400, 180)"> <!-- Center of diamond -->
    <polygon points="0,-50 80,0 0,50 -80,0" fill="#e9ecef" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">What is the
    <tspan x="0" dy="1.2em">Error?</tspan></text>
  </g>

  <!-- Nodes Level 2 -->
  <!-- Lock -->
  <g transform="translate(50, 350)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="60" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Check who holds</text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">the lock</text>
  </g>

  <!-- Backup -->
  <g transform="translate(310, 350)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="60" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Restored from</text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">S3 Versioning</text>
  </g>

  <!-- Refresh -->
  <g transform="translate(570, 350)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="60" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Is reality different</text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">than code?</text>
  </g>

  <!-- Nodes Level 3 -->
  <!-- Force -->
  <g transform="translate(50, 500)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="60" rx="10" ry="10" fill="#ffd43b" stroke="#333" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" font-family="Monospace" font-size="12" font-weight="bold" fill="#333">terraform force-unlock</text>
  </g>

  <!-- Push -->
  <g transform="translate(310, 500)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="60" rx="10" ry="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" font-family="Monospace" font-size="12" font-weight="bold" fill="#333">terraform state push</text>
  </g>

  <!-- Sync -->
  <g transform="translate(570, 500)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="60" rx="10" ry="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Update HCL or</text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Overwrite</text>
  </g>

  <!-- Connections -->
  <!-- Error -> Identify -->
  <line x1="400" y1="110" x2="400" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Identify -> Lock -->
  <path d="M 320 180 L 140 180 L 140 340" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="190" y="165" width="50" height="25" rx="5" fill="#fff" stroke="#ccc"/>
  <text x="215" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Lock</text>

  <!-- Identify -> Backup -->
  <line x1="400" y1="230" x2="400" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="370" y="260" width="60" height="25" rx="5" fill="#fff" stroke="#ccc"/>
  <text x="400" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Corrupt</text>

  <!-- Identify -> Refresh -->
  <path d="M 480 180 L 660 180 L 660 340" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="540" y="165" width="50" height="25" rx="5" fill="#fff" stroke="#ccc"/>
  <text x="565" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Drift</text>

  <!-- Lock -> Force -->
  <line x1="140" y1="410" x2="140" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="145" y="450" text-anchor="start" font-family="Arial, sans-serif" font-size="11">Dead Process</text>

  <!-- Backup -> Push -->
  <line x1="400" y1="410" x2="400" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="405" y="450" text-anchor="start" font-family="Arial, sans-serif" font-size="11">Compare</text>

  <!-- Refresh -> Sync -->
  <line x1="660" y1="410" x2="660" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="665" y="450" text-anchor="start" font-family="Arial, sans-serif" font-size="11">Manual Change</text>

</svg>
