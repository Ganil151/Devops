---
- name: Configure Web Server
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx
      apt:
        name: nginx
        state: latest

    - name: Create custom index.html
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Terraform + Ansible Integration</title>
              <style>
                  body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f9; }
                  h1 { color: #5c4ee5; }
                  .container { border: 2px solid #5c4ee5; display: inline-block; padding: 20px; border-radius: 10px; background: white; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Provisioned by Terraform</h1>
                  <h2>Configured by Ansible</h2>
                  <p>Deployment Successful!</p>
              </div>
          </body>
          </html>
        dest: /var/www/html/index.html

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes
