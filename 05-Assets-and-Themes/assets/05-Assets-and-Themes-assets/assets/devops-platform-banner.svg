<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGradient)" rx="10"/>
  
  <!-- DevOps infinity symbol -->
  <path d="M150 100 C150 80, 170 60, 200 60 C230 60, 250 80, 250 100 C250 120, 270 140, 300 140 C330 140, 350 120, 350 100 C350 80, 330 60, 300 60 C270 60, 250 80, 250 100 C250 120, 230 140, 200 140 C170 140, 150 120, 150 100 Z" 
        fill="none" stroke="#00d4aa" stroke-width="4"/>
  
  <!-- Main title -->
  <text x="400" y="80" text-anchor="middle" fill="url(#textGradient)" font-family="Arial, sans-serif" font-size="32" font-weight="bold">
    DevOps Mastery Platform
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="110" text-anchor="middle" fill="#b3e5fc" font-family="Arial, sans-serif" font-size="16">
    Zero to Enterprise & Beyond
  </text>
  
  <!-- Continuous learning arrows -->
  <path d="M500 130 L520 140 L500 150 M520 140 L580 140" stroke="#00d4aa" stroke-width="2" fill="none"/>
  <text x="550" y="155" text-anchor="middle" fill="#81c784" font-family="Arial, sans-serif" font-size="12">
    Continuous Learning
  </text>
  
  <!-- Development cycle -->
  <circle cx="650" cy="100" r="30" fill="none" stroke="#ff7043" stroke-width="3" stroke-dasharray="5,5">
    <animateTransform attributeName="transform" type="rotate" values="0 650 100;360 650 100" dur="10s" repeatCount="indefinite"/>
  </circle>
  <text x="650" y="105" text-anchor="middle" fill="#ffab91" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
    CI/CD
  </text>
  
  <!-- Bottom tagline -->
  <text x="400" y="175" text-anchor="middle" fill="#90caf9" font-family="Arial, sans-serif" font-size="14" font-style="italic">
    "Infrastructure is the canvas, code is the brush—DevOps is the art of scale."
  </text>
</svg>