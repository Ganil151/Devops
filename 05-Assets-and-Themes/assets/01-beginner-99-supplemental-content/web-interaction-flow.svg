<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #1e1e1e; }
      .box { fill: #2d2d2d; stroke: #306998; stroke-width: 2; rx: 10; ry: 10; }
      .box-service { fill: #2d2d2d; stroke: #ff9800; stroke-width: 2; rx: 10; ry: 10; }
      .text { fill: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .title { fill: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #e0e0e0; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e0e0e0" />
    </marker>
  </defs>
  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" class="title">Web Interaction &amp; Scraping Flow</text>

  <!-- Python Script -->
  <rect x="50" y="150" width="150" height="100" class="box" />
  <text x="125" y="200" class="text">Python Script</text>
  <text x="125" y="220" class="text" style="font-size:12px; fill:#aaa;">(Requests/BS4)</text>

  <!-- HTTP Call -->
  <path d="M 200 180 L 330 150" class="arrow" />
  <text x="265" y="160" class="text" style="font-size:12px;">HTTP GET/POST</text>

  <!-- Web Content -->
  <rect x="350" y="100" width="150" height="100" class="box-service" />
  <text x="425" y="145" class="text">Web Portal / API</text>
  <text x="425" y="165" class="text" style="font-size:12px; fill:#aaa;">(Server Output)</text>

  <!-- Response -->
  <path d="M 350 200 L 200 230" class="arrow" />
  <text x="275" y="235" class="text" style="font-size:12px;">JSON / HTML</text>

  <!-- Extraction -->
  <rect x="550" y="150" width="180" height="100" class="box" stroke="#4caf50" />
  <text x="640" y="200" class="text">Extracted Data</text>
  <text x="640" y="220" class="text" style="font-size:12px; fill:#aaa;">(Structured Database)</text>

  <path d="M 200 200 L 550 200" class="arrow" stroke-dasharray="4" />
  <text x="375" y="195" class="text" style="font-size:12px;">Parser &amp; Cleanup</text>
</svg>
