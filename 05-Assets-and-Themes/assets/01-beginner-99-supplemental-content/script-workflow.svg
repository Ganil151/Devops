<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Mode Script Workflow -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888" />
    </marker>

    <linearGradient id="startGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="errorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF5350;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C62828;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121212;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#121212" />

  <!-- 1. Execution Trigger -->
  <g transform="translate(300, 20)">
    <rect width="200" height="50" rx="25" fill="url(#startGrad)" filter="url(#shadow)" />
    <text x="100" y="32" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#fff" font-size="14">1. Execution Trigger</text>
  </g>
  <line x1="400" y1="70" x2="400" y2="100" stroke="#888" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. Shebang -->
  <g transform="translate(300, 100)">
    <rect width="200" height="50" rx="10" fill="#1e1e1e" stroke="#BB86FC" stroke-width="2" />
    <text x="100" y="32" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#BB86FC" font-size="13">2. Shebang / Interpreter</text>
  </g>
  <line x1="400" y1="150" x2="400" y2="180" stroke="#888" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. Metadata -->
  <g transform="translate(300, 180)">
    <rect width="200" height="50" rx="10" fill="#1e1e1e" stroke="#2196F3" stroke-width="2" />
    <text x="100" y="32" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#2196F3" font-size="13">3. Metadata / Usage</text>
  </g>
  <line x1="400" y1="230" x2="400" y2="260" stroke="#888" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4. Constants -->
  <g transform="translate(300, 260)">
    <rect width="200" height="50" rx="10" fill="#1e1e1e" stroke="#FF9800" stroke-width="2" />
    <text x="100" y="32" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#FF9800" font-size="13">4. Constants / Config</text>
  </g>
  <line x1="400" y1="310" x2="400" y2="340" stroke="#888" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 5. Dependencies -->
  <g transform="translate(300, 340)">
    <polygon points="100,0 200,30 100,60 0,30" fill="#1e1e1e" stroke="#03DAC6" stroke-width="2" />
    <text x="100" y="35" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#03DAC6" font-size="12">5. Dependencies?</text>
  </g>

  <!-- Missing path -->
  <line x1="300" y1="370" x2="200" y2="370" stroke="#888" stroke-width="2" marker-end="url(#arrow)" />
  <text x="250" y="365" text-anchor="middle" font-family="Arial" font-size="11" fill="#EF5350">Missing</text>
  <rect x="100" y="350" width="100" height="40" rx="5" fill="#C62828" />
  <text x="150" y="375" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">EXIT Fail</text>

  <!-- Present path -->
  <line x1="400" y1="400" x2="400" y2="430" stroke="#888" stroke-width="2" marker-end="url(#arrow)" />
  <text x="415" y="415" text-anchor="middle" font-family="Arial" font-size="11" fill="#4CAF50">Present</text>

  <!-- 6. Functions -->
  <g transform="translate(300, 430)">
    <rect width="200" height="50" rx="10" fill="#1e1e1e" stroke="#4CAF50" stroke-width="2" />
    <text x="100" y="32" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#4CAF50" font-size="13">6. Load Functions</text>
  </g>
  <line x1="400" y1="480" x2="400" y2="510" stroke="#888" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 7. Entry Point? -->
  <g transform="translate(300, 510)">
    <polygon points="100,0 200,30 100,60 0,30" fill="#1e1e1e" stroke="#FF9800" stroke-width="2" />
    <text x="100" y="35" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#FF9800" font-size="12">7. Entry Point?</text>
  </g>

  <!-- No path -->
  <line x1="300" y1="540" x2="200" y2="540" stroke="#888" stroke-width="2" marker-end="url(#arrow)" />
  <text x="250" y="535" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">No</text>
  <rect x="50" y="520" width="150" height="40" rx="5" fill="#1e1e1e" stroke="#888" stroke-width="1" />
  <text x="125" y="545" text-anchor="middle" font-family="Arial" font-size="12" fill="#E0E0E0">Line-by-Line Exec</text>

  <!-- Yes path -->
  <line x1="500" y1="540" x2="600" y2="540" stroke="#888" stroke-width="2" marker-end="url(#arrow)" />
  <text x="550" y="535" text-anchor="middle" font-family="Arial" font-size="11" fill="#4CAF50">Yes</text>
  <rect x="600" y="520" width="150" height="40" rx="5" fill="#1e1e1e" stroke="#4CAF50" stroke-width="2" />
  <text x="675" y="545" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#4CAF50">Main Func Exec</text>

  <!-- Connections to Cleanup -->
  <path d="M 125 560 L 125 620 L 300 620" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 675 560 L 675 620 L 500 620" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- 8. Cleanup -->
  <g transform="translate(300, 600)">
    <rect width="200" height="50" rx="10" fill="#1e1e1e" stroke="#EF5350" stroke-width="2" />
    <text x="100" y="32" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#EF5350" font-size="13">8. Cleanup &amp; Trap</text>
  </g>
  <line x1="400" y1="650" x2="400" y2="680" stroke="#888" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 9. Final Exit -->
  <g transform="translate(300, 680)">
    <rect width="200" height="50" rx="25" fill="#2196F3" filter="url(#shadow)" />
    <text x="100" y="32" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#fff" font-size="14">9. Final Exit Code</text>
  </g>

</svg>
