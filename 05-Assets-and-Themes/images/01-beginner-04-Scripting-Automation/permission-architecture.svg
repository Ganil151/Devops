<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="500" fill="#0f172a" />
  
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" fill="url(#grid)" />

  <!-- Title Left -->
  <text x="300" y="60" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">🧬 PERMISSION STRING ANATOMY</text>

  <!-- String Breakdown -->
  <g transform="translate(100, 150)">
    <!-- Type -->
    <rect x="0" y="0" width="80" height="80" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="40" y="50" fill="#ffffff" font-family="monospace" font-size="32" text-anchor="middle" font-weight="bold">d</text>
    <text x="40" y="110" fill="#94a3b8" font-family="Arial" font-size="12" text-anchor="middle">TYPE</text>
    
    <!-- User -->
    <rect x="100" y="0" width="120" height="80" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <text x="160" y="50" fill="#ef4444" font-family="monospace" font-size="32" text-anchor="middle" font-weight="bold">rwx</text>
    <text x="160" y="110" fill="#fca5a5" font-family="Arial" font-size="12" text-anchor="middle">OWNER</text>

    <!-- Group -->
    <rect x="240" y="0" width="120" height="80" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="2" />
    <text x="300" y="50" fill="#f59e0b" font-family="monospace" font-size="32" text-anchor="middle" font-weight="bold">r-x</text>
    <text x="300" y="110" fill="#fef3c7" font-family="Arial" font-size="12" text-anchor="middle">GROUP</text>

    <!-- Others -->
    <rect x="380" y="0" width="120" height="80" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <text x="440" y="50" fill="#3b82f6" font-family="monospace" font-size="32" text-anchor="middle" font-weight="bold">r--</text>
    <text x="440" y="110" fill="#dbeafe" font-family="Arial" font-size="12" text-anchor="middle">WORLD</text>
  </g>

  <!-- Divider -->
  <line x1="650" y1="50" x2="650" y2="450" stroke="#1e293b" stroke-width="2" />

  <!-- Right Side: Octal Math -->
  <text x="900" y="60" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">🔢 THE OCTAL MATH</text>

  <g transform="translate(800, 150)">
    <rect x="-100" y="0" width="200" height="50" rx="4" fill="#334155" />
    <text x="0" y="30" fill="#ffffff" font-family="monospace" font-size="16" text-anchor="middle">READ (r) = 4</text>
    
    <rect x="-100" y="70" width="200" height="50" rx="4" fill="#334155" />
    <text x="0" y="100" fill="#ffffff" font-family="monospace" font-size="16" text-anchor="middle">WRITE (w) = 2</text>

    <rect x="-100" y="140" width="200" height="50" rx="4" fill="#334155" />
    <text x="0" y="170" fill="#ffffff" font-family="monospace" font-size="16" text-anchor="middle">EXEC (x) = 1</text>
    
    <line x1="-120" y1="210" x2="120" y2="210" stroke="#64748b" stroke-width="2" />
    <text x="0" y="240" fill="#10b981" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">SUM = OCTAL DIGIT</text>
    <text x="0" y="270" fill="#94a3b8" font-family="Arial" font-size="12" text-anchor="middle">Example: r-x = 4 + 0 + 1 = 5</text>
  </g>

  <!-- Footer -->
  <text x="1180" y="480" fill="#64748b" font-family="Arial" font-size="16" text-anchor="end" font-weight="bold">FILE PERMISSIONS ARCHITECTURE</text>
</svg>
