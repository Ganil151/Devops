<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="500" fill="#0f172a" />
  
  <!-- Divider -->
  <line x1="600" y1="50" x2="600" y2="450" stroke="#1e293b" stroke-width="2" />

  <!-- Left Side: Characteristics -->
  <text x="300" y="80" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">⚙️ SHELL SCRIPT CHARACTERISTICS</text>
  
  <g transform="translate(150, 150)">
    <!-- Text Based -->
    <rect x="0" y="0" width="300" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="20" y="35" fill="#3b82f6" font-family="Arial" font-size="16" font-weight="bold">TEXT-BASED</text>
    <text x="140" y="35" fill="#94a3b8" font-family="Arial" font-size="14"> - Easy to edit & version</text>
    
    <!-- Interpreted -->
    <rect x="0" y="80" width="300" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="20" y="115" fill="#10b981" font-family="Arial" font-size="16" font-weight="bold">INTERPRETED</text>
    <text x="140" y="115" fill="#94a3b8" font-family="Arial" font-size="14"> - No compilation required</text>

    <!-- Portable -->
    <rect x="0" y="160" width="300" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="20" y="195" fill="#f59e0b" font-family="Arial" font-size="16" font-weight="bold">PORTABLE</text>
    <text x="140" y="195" fill="#94a3b8" font-family="Arial" font-size="14"> - Runs across Unix systems</text>
  </g>

  <!-- Right Side: Layered Architecture -->
  <text x="900" y="80" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">🏗️ THE SYSTEM LAYERS</text>

  <g transform="translate(750, 120)">
    <!-- User -->
    <rect x="0" y="0" width="300" height="50" rx="25" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2" />
    <text x="150" y="30" fill="#ffffff" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">USER INTERFACE</text>
    
    <!-- Shell -->
    <rect x="25" y="70" width="250" height="120" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <text x="150" y="100" fill="#ffffff" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">SHELL LAYER</text>
    <text x="150" y="130" fill="#94a3b8" font-family="monospace" font-size="14">Bash / Zsh / Sh</text>
    <text x="150" y="160" fill="#10b981" font-family="Arial" font-size="12" text-anchor="middle">Interpreter Engine</text>

    <!-- Kernel -->
    <rect x="50" y="210" width="200" height="60" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <text x="150" y="245" fill="#ef4444" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">KERNEL</text>

    <!-- Hardware -->
    <rect x="75" y="290" width="150" height="40" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="150" y="315" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">HARDWARE</text>
  </g>

  <!-- Footer -->
  <text x="1180" y="480" fill="#64748b" font-family="Arial" font-size="16" text-anchor="end" font-weight="bold">SHELL SCRIPTING ARCHITECTURE</text>
</svg>
