# Topic: Infracost Usage-Based Configuration
# Description: Defines expected usage metrics for accurate serverless/S3 pricing.

version: 0.1

resource_usage:
  # S3 bucket usage (Pricing depends on GB stored and API calls)
  aws_s3_bucket.static_assets:
    storage_gb: 500
    monthly_tier_1_requests: 1000000 # PUT, COPY, POST
    monthly_tier_2_requests: 5000000 # GET, SELECT

  # AWS Lambda usage (Pricing depends on request count and duration)
  aws_lambda_function.image_processor:
    monthly_requests: 10000000
    request_duration_ms: 250

  # Data Transfer (Often the 'hidden' cost)
  aws_instance.web_server:
    monthly_data_transfer_gb: 1500
