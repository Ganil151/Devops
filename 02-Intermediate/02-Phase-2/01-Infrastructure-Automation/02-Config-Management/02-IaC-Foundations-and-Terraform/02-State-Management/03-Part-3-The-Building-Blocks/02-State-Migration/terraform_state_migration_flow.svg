<svg width="1100" height="300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feFlood flood-color="#000000" flood-opacity="0.5" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="300" fill="url(#bg-gradient)" rx="15" ry="15" />

  <!-- Connectors -->
  <!-- A -> B -->
  <path d="M140 150 L180 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="160" y="140" text-anchor="middle" fill="#94a3b8" font-size="10">Update Code</text>

  <!-- B -> C -->
  <path d="M320 150 L360 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="340" y="140" text-anchor="middle" fill="#94a3b8" font-size="10">Initialize</text>

  <!-- C -> D -->
  <path d="M480 150 L520 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="500" y="140" text-anchor="middle" fill="#94a3b8" font-size="10">Confirm</text>

  <!-- D -> E -->
  <path d="M620 150 L660 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="640" y="140" text-anchor="middle" fill="#94a3b8" font-size="10">Yes</text>

  <!-- E -> F -->
  <path d="M800 150 L840 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="820" y="140" text-anchor="middle" fill="#94a3b8" font-size="10">Success</text>


  <!-- NODES -->

  <!-- Node A: Local State (Reddish) -->
  <g transform="translate(20, 120)">
    <rect width="120" height="60" rx="6" fill="#f8d7da" stroke="#721c24" stroke-width="2" filter="url(#glass-shadow)"/>
    <text x="60" y="35" text-anchor="middle" fill="#721c24" font-size="12" font-weight="bold">Local State</text>
  </g>

  <!-- Node B: Backend Block -->
  <g transform="translate(180, 120)">
    <rect width="140" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#glass-shadow)"/>
    <text x="70" y="25" text-anchor="middle" fill="#e2e8f0" font-size="12">Backend Block</text>
    <text x="70" y="45" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">in HCL</text>
  </g>

  <!-- Node C: terraform init -->
  <g transform="translate(360, 120)">
    <rect width="120" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#glass-shadow)"/>
    <text x="60" y="35" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12">terraform init</text>
  </g>

  <!-- Node D: Decision (Diamond) -->
  <g transform="translate(520, 100)">
    <path d="M50 0 L100 50 L50 100 L0 50 Z" fill="#334155" stroke="#94a3b8" stroke-width="2" filter="url(#glass-shadow)"/>
    <text x="50" y="45" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">Copy State?</text>
  </g>

  <!-- Node E: Remote Backend (Greenish) -->
  <g transform="translate(660, 120)">
    <rect width="140" height="60" rx="6" fill="#d4edda" stroke="#155724" stroke-width="2" filter="url(#glass-shadow)"/>
    <text x="70" y="25" text-anchor="middle" fill="#155724" font-size="12" font-weight="bold">Remote Backend</text>
    <text x="70" y="45" text-anchor="middle" fill="#155724" font-size="10">(S3)</text>
  </g>

  <!-- Node F: Shared Source of Truth -->
  <g transform="translate(840, 120)">
    <rect width="160" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#glass-shadow)"/>
    <text x="80" y="25" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Source of Truth</text>
    <text x="80" y="45" text-anchor="middle" fill="#94a3b8" font-size="10">Shared</text>
  </g>

</svg>
