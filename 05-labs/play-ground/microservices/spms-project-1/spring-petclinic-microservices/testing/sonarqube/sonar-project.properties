# SonarQube Configuration for Spring PetClinic Microservices
# https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# Project Identification
sonar.projectKey=spring-petclinic-microservices
sonar.projectName=Spring PetClinic Microservices
sonar.projectVersion=1.0

# Source Code
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java Version
sonar.java.source=17
sonar.java.target=17

# Encoding
sonar.sourceEncoding=UTF-8

# Test Coverage (JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Exclusions
sonar.exclusions=**/generated/**,**/*.xml,**/*.yml,**/*.yaml,**/resources/**
sonar.test.exclusions=**/test/**,**/*Test.java,**/*Tests.java

# Code Smells & Bugs
sonar.issue.ignore.multicriteria=e1,e2

# Ignore: "Utility classes should not have public constructors"
sonar.issue.ignore.multicriteria.e1.ruleKey=squid:S1118
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*Application.java

# Ignore: "Tests should include assertions"
sonar.issue.ignore.multicriteria.e2.ruleKey=squid:S2699
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*Test.java

# Language-specific settings
sonar.java.binaries=target/classes
sonar.java.libraries=target/dependency/*.jar

# Quality Gates (Fail pipeline if not met)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Links
sonar.links.homepage=https://github.com/spring-petclinic/spring-petclinic-microservices
sonar.links.ci=https://jenkins.example.com/job/petclinic
sonar.links.scm=https://github.com/spring-petclinic/spring-petclinic-microservices
