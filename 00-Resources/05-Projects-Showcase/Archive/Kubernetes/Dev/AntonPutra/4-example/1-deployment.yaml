---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp 
  namespace: 4-example
spec:
  replicas: 5
  selector:
   matchLabels:
     app: myapp
  template:
   metadata:
     labels:
       app: myapp
   spec:
    containers:
      - name: myapp
        image: ganil151/myapp-v1.0:1.0
        ports:
          - name: http
            containerPort: 8080
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "500m"
