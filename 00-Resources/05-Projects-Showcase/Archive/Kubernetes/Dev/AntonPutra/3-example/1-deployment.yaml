---
apiVersion: app/v1
kind: Deployment
metadata:
  name: my-app
  namespace: 3-example

spec:
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      - name: my-app
        image: ganil151/my-app:v1.0.0
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 256Mi  
           
