apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: global-mesh-showcase
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-repo/devops-mastery.git
    targetRevision: HEAD
    path: 00-Resources/05-Projects-Showcase/Global-Microservices-Mesh/app-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
