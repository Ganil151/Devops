apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-frontend
  namespace: istio-ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mesh-frontend
  template:
    metadata:
      labels:
        app: mesh-frontend
        istio-injection: enabled
    spec:
      containers:
      - name: frontend
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-frontend-svc
  namespace: istio-ingress
spec:
  selector:
    app: mesh-frontend
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: mesh-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    *
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: mesh-vs
  namespace: istio-ingress
spec:
  hosts:
  *
  gateways:
  - mesh-gateway
  http:
  - route:
    - destination:
        host: mesh-frontend-svc
        port:
          number: 80
