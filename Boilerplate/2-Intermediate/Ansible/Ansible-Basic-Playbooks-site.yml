---
# -----------------------------------------------------------------------------
# Name: site.yml
# Description: Standard Playbook Structure
# -----------------------------------------------------------------------------

# 1. Target Section: Where does this run?
- name: Configure Web Servers
  hosts: webservers
  become: yes  # Run as root (sudo)

  # 2. Variable Section: What data do we need?
  vars:
    http_port: 80
    worker_processes: 4

  # 3. Tasks Section: What should happen?
  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure configuration matches template
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: Restart Nginx  # Triggers a handler

    - name: Ensure service is running
      service:
        name: nginx
        state: started
        enabled: yes

  # 4. Handlers Section: What reacts to changes?
  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
