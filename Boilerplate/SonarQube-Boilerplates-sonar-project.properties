# -----------------------------------------------------------------------------
# Name: sonar-project.properties
# Description: Standard configuration for SonarScanner.
# Place this in the root of your project.
# -----------------------------------------------------------------------------

# 1. Project Identification
sonar.projectKey=my-webapp-project
sonar.projectName=My Web Application
sonar.projectVersion=1.0

# 2. Source Paths
sonar.sources=src
sonar.exclusions=**/test/**, **/dist/**, **/node_modules/**

# 3. Test Paths
sonar.tests=src/test

# 4. Coverage Configuration (Example for JaCoCo/LCOV)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.java.binaries=target/classes

# 5. Encoding
sonar.sourceEncoding=UTF-8

# 6. Quality Gate Failure (Ensures scan fails build if gate failed)
sonar.qualitygate.wait=true
