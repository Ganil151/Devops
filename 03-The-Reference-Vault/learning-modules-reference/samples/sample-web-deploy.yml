---
# Topic: Professional Playbook Structure
# Description: This sample demonstrates idempotency, handlers, and the use of variables.

- name: Deploy High-Availability Web Server
  hosts: webservers
  become: yes
  vars:
    web_port: 80
    config_dest: /etc/nginx/nginx.conf

  tasks:
    # 1. Package Installation (Idempotent: does nothing if already present)
    - name: Ensure Nginx is installed
      apt:
        name: nginx
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    # 2. Configuration Management (Triggers handler if changed)
    - name: Deploy dynamic configuration
      template:
        src: nginx.conf.j2
        dest: "{{ config_dest }}"
        owner: root
        group: root
        mode: '0644'
      notify: Restart Nginx

    # 3. State Enforcement
    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    # 4. Verification Check
    - name: Check local health endpoint
      uri:
        url: "http://localhost:{{ web_port }}"
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 5
      delay: 2

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
      listen: "restart-web-service"
