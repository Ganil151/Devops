---
# Topic: Advanced Error Handling (Block/Rescue)
# Description: Demonstrates fail-safe patterns and recovery logic.

- name: Resilient Data Migration
  hosts: localhost
  connection: local
  tasks:
    - name: Execute Critical Migration
      block:
        - name: Step 1: Export legacy data
          command: /usr/local/bin/export_data.sh
          register: export_result

        - name: Step 2: Validate Data Integrity
          fail:
            msg: "Data corruption detected!"
          # Simulating a failure condition
          when: "'corrupt' in export_result.stdout"

      rescue:
        - name: Recovery: Notify Slack of failure
          uri:
            url: "https://hooks.slack.com/services/xxx"
            method: POST
            body_format: json
            body:
              text: "🚨 Migration failed on {{ inventory_hostname }}. Automatic rollback triggered."
          ignore_errors: yes

        - name: Recovery: Restore from last snapshot
          shell: /usr/local/bin/rollback.sh

      always:
        - name: Cleanup: Remove temporary export files
          file:
            path: /tmp/migration_export.sql
            state: absent
