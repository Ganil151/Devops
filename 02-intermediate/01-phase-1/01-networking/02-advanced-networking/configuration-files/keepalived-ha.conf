# ==========================================
# NRE Standard: Keepalived (Floating IP / HA)
# ==========================================
# Use Case: You have two Load Balancers (LB-1, LB-2) on Premise.
# You need ONE IP (192.168.1.100) that floats between them.
# ==========================================

global_defs {
    router_id LVS_DEVOPS
}

# The Script that decides "Am I Healthy?"
vrrp_script check_nginx {
    script "/usr/bin/killall -0 nginx"
    interval 2
    weight 2
}

# Configuration for MASTER Node (LB-1)
vrrp_instance VI_1 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 101           # Higher wins. Slave should be 100.
    advert_int 1
    
    authentication {
        auth_type PASS
        auth_pass s3cret
    }
    
    # The Floating IP
    virtual_ipaddress {
        192.168.1.100/24
    }
    
    track_script {
        check_nginx
    }
}
